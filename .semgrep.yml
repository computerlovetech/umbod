rules:
  - id: python.no-print-use-typer-output
    languages:
      - python
    severity: ERROR
    message: >-
      Harness metric violation: do not use print(...). Start a Refactorer subagent for this file.
      Subagent prompt: Refactor the reported file to remove print(...) usage. For Typer CLI output,
      use typer.echo or typer.secho; otherwise route output through the existing logging, event, or response
      boundary. Preserve public behavior, keep the change focused, and run the relevant targeted tests plus
      Semgrep for this file.
    paths:
      include:
        - '**/api/src/**'
        - '**/api/tests/**'
        - '**/frontend/src/**'
        - '**/src/**'
    pattern: print(...)
