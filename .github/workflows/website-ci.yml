name: Website CI
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  website:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: umbod/uv.lock
      - name: Install documentation dependencies
        working-directory: umbod
        run: uv sync --only-group docs --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install website test and build dependencies
        working-directory: website
        run: bun install --frozen-lockfile
      - name: Website tests
        working-directory: website
        run: bun run test
      - name: Kubernetes release invariants
        working-directory: umbod
        run: uv run --no-project --python 3.12 --with pytest==9.0.2 --with pyyaml==6.0.3 python -m pytest scripts/tests/test_release_versions.py scripts/tests/test_release_workflow.py scripts/tests/test_website_deployment.py -q
      - name: Website build
        working-directory: website
        run: bun run build:ci
