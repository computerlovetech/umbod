name: Desktop native builds
on:
  pull_request:
    paths: ['umbod/api/**', 'packages/umbod-sdk/**', 'desktop/**', 'website/**', '.github/workflows/desktop-*.yml', '.dockerignore', 'flake.nix', 'flake.lock']
  push:
    branches: [main, feat/desktop-monorepo-releases]
    paths: ['umbod/api/**', 'packages/umbod-sdk/**', 'desktop/**', 'website/**', '.github/workflows/desktop-*.yml', '.dockerignore', 'flake.nix', 'flake.lock']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install website test and build dependencies
        working-directory: website
        run: bun install --frozen-lockfile
      - run: python3 -m unittest discover -s desktop/tests -v
      - run: node --test website/tests/*.test.mjs
      - name: Existing Kubernetes release invariants
        working-directory: umbod
        run: |
          python3 -m pip install pytest pyyaml
          python3 -m pytest scripts/tests/test_release_versions.py scripts/tests/test_release_workflow.py -q
      - name: Website build
        working-directory: website
        run: bun run build
  macos:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify full Xcode and SwiftUI toolchain
        run: bash scripts/check-macos-toolchain.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Python host, packaged bridge, and Swift logic tests
        run: bash scripts/verify.sh
      - name: Build unsigned prerelease DMG
        run: bash scripts/package.sh
      - name: Install DMG and verify packaged release application
        run: |
          version="$(python3 scripts/release.py version)"
          python3 scripts/install-smoke.py "dist/Umbod-$version-arm64.dmg"
      - name: Keychain persistence in a disposable CI keychain
        run: |
          version="$(python3 scripts/release.py version)"
          python3 scripts/keychain-smoke.py "dist/Umbod-$version.app"
      - name: Prepare standalone acceptance harness
        run: |
          bash scripts/prepare-macos-acceptance.sh "$RUNNER_TEMP/macos-acceptance-kit"
          tar -czf "$RUNNER_TEMP/macos-acceptance-kit.tar.gz" -C "$RUNNER_TEMP/macos-acceptance-kit" .
      - uses: actions/upload-artifact@v4
        with:
          name: macos-acceptance-kit
          path: ${{ runner.temp }}/macos-acceptance-kit.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: desktop/dist/Umbod-*-arm64.dmg
          if-no-files-found: error
  macos-acceptance:
    needs: macos
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      # Deliberately no checkout or development-tool installation.
      - uses: actions/download-artifact@v4
        with:
          name: desktop-macos-arm64
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: macos-acceptance-kit
          path: kit
      - name: Accept the exact release DMG without a source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          mkdir harness
          tar -xzf kit/macos-acceptance-kit.tar.gz -C harness
          shasum -a 256 candidate/*.dmg > artifact-sha256.txt
          env -i HOME="$HOME" TMPDIR="$(getconf DARWIN_USER_TEMP_DIR)" PATH=/usr/bin:/bin:/usr/sbin:/sbin GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            /bin/bash harness/scripts/accept-macos-artifact.sh "$PWD"/candidate/*.dmg 2>&1 | tee acceptance.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-acceptance-evidence
          path: |
            acceptance.log
            artifact-sha256.txt
          if-no-files-found: error
