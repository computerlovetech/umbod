name: harness-linting

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-linting:
    name: harness-linting
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: skills/development/write-module-readme/requirements.txt

      - name: Install lint dependencies
        run: python -m pip install -r skills/development/write-module-readme/requirements.txt

      - name: Test skill template validation
        run: python -m unittest discover -s skills/development/write-skill/tests

      - name: Validate write-skill template compliance
        run: python skills/development/write-skill/scripts/validate_skill.py skills/development/write-skill/SKILL.md

      - name: Test README link and navigation validation
        run: python -m unittest discover -s skills/development/write-module-readme/tests

      - name: Validate source module READMEs against OKF v0.2
        run: python skills/development/write-module-readme/scripts/check_module_readmes.py .

      - name: Validate source module README body format
        run: python skills/development/write-module-readme/scripts/check_readme_bodies.py .

      - name: Validate local links in all repository READMEs
        run: python skills/development/write-module-readme/scripts/check_readme_links.py .

      - name: Validate source README navigation
        run: python skills/development/write-module-readme/scripts/check_readme_navigation.py .
