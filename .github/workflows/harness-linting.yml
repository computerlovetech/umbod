name: harness-linting

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-linting:
    name: harness-linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint dependencies
        run: python -m pip install -r skills/development/write-module-readme/requirements.txt

      - name: Validate source module READMEs against OKF v0.2
        run: python skills/development/write-module-readme/scripts/check_module_readmes.py .

      - name: Validate source module README body format
        run: python skills/development/write-module-readme/scripts/check_readme_bodies.py .

      - name: Validate local links in all repository READMEs
        run: python skills/development/write-module-readme/scripts/check_readme_links.py .
