name: umbod CI

run-name: ${{ github.workflow }} on ${{ github.ref_name }} @ ${{ github.sha }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.github/ci-paths.yml'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'ruff.toml'
      - '.ruff.toml'
      - 'website/**'
      - 'release-metadata.json'
      - '.semgrep.yml'
      - '.semgrep/**'
      - '.semgrepignore'
      - 'codecov.yml'
      - 'umbod/**'
      - 'packages/umbod-sdk/**'
      - '**/README.md'
      - 'skills/**'
      - 'LICENSE'
      - '.github/workflows/**'
      - '.github/actions/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-linting:
    uses: ./.github/workflows/harness-linting.yml

  changes:
    needs: harness-linting
    name: Detect relevant changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.recovery.outputs.full || steps.filter.outputs.backend }}
      sdk: ${{ steps.recovery.outputs.full || steps.filter.outputs.sdk }}
      lint: ${{ steps.recovery.outputs.full || steps.filter.outputs.lint }}
      semgrep: ${{ steps.recovery.outputs.full || steps.filter.outputs.semgrep }}
      installers: ${{ steps.recovery.outputs.full || steps.filter.outputs.installers }}
      scripts: ${{ steps.recovery.outputs.full || steps.filter.outputs.scripts }}
      website: ${{ steps.recovery.outputs.full || steps.filter.outputs.website }}
      core: ${{ steps.recovery.outputs.full || steps.filter.outputs.core }}
      connector: ${{ steps.recovery.outputs.full || steps.filter.outputs.connector }}
      frontend: ${{ steps.recovery.outputs.full || steps.filter.outputs.frontend }}
      helm: ${{ steps.recovery.outputs.full || steps.filter.outputs.helm }}
      kind: ${{ steps.recovery.outputs.full || steps.filter.outputs.kind }}
    steps:
      - name: Recover work from an unsuccessful main push
        id: recovery
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          FORCED_PUSH: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          if [[ "$FORCED_PUSH" != 'true' ]] &&
            previous_successful_sha="$(timeout 15s gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/umbod-ci.yml/runs" \
              -f branch=main -f event=push -F per_page=100 \
              --jq "[.workflow_runs[] | select(.run_number < ${GITHUB_RUN_NUMBER})] | max_by(.run_number) | select(.conclusion == \"success\") | .head_sha")" &&
            [[ -n "$previous_successful_sha" && "$previous_successful_sha" == "$BEFORE_SHA" ]]; then
            exit 0
          fi
          echo 'Previous main push is not confirmed green; selecting all CI jobs.'
          echo 'full=true' >> "$GITHUB_OUTPUT"

      - if: steps.recovery.outputs.full != 'true'
        uses: useblacksmith/checkout@v1

      - id: filter
        if: steps.recovery.outputs.full != 'true'
        uses: dorny/paths-filter@v3
        with:
          filters: .github/ci-paths.yml

  docs:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    name: Website and documentation
    uses: ./.github/workflows/website-ci.yml

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    name: Python correctness lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: |
            umbod/api/uv.lock
            packages/umbod-sdk/uv.lock
      - name: Lint API
        working-directory: umbod/api
        run: uv run --locked ruff check .
      - name: Lint SDK
        working-directory: packages/umbod-sdk
        run: uv run --locked ruff check .

  semgrep:
    needs: changes
    if: needs.changes.outputs.semgrep == 'true'
    name: Shared Semgrep rules
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    defaults:
      run:
        working-directory: umbod
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: umbod/uv.lock
      - name: Scan application sources
        run: bash scripts/run_semgrep.sh
      - name: Scan for native frontend buttons
        run: bash scripts/run_semgrep.sh --frontend-advisory

  sdk-tests:
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    name: Umbod SDK Tests and Installed Wheel
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: packages/umbod-sdk
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: packages/umbod-sdk/uv.lock
      - name: Test SDK
        run: uv run --locked pytest tests -q --cov --cov-report=xml:coverage.xml
      - name: Save SDK coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-coverage
          path: packages/umbod-sdk/coverage.xml
          if-no-files-found: error
          retention-days: 14
      - name: Upload SDK coverage
        uses: codecov/codecov-action@4481f553995cc5011b158ce191746ac1a1d0f815
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/umbod-sdk/coverage.xml
          flags: sdk
          disable_search: true
          fail_ci_if_error: false
      - name: Verify installed SDK wheel
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel --out-dir "${RUNNER_TEMP}/sdk-dist"
          uv venv --python 3.14 "${RUNNER_TEMP}/sdk-smoke"
          uv pip install --python "${RUNNER_TEMP}/sdk-smoke/bin/python" "${RUNNER_TEMP}"/sdk-dist/*.whl
          env -u PYTHONPATH "${RUNNER_TEMP}/sdk-smoke/bin/python" smoke_tests/installed_wheel.py

  plugin-installers:
    needs: changes
    if: needs.changes.outputs.installers == 'true'
    name: Plugin installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            tests: test_plugin_installers.py
          - os: ubuntu-latest
            tests: test_plugin_installers.py
          - os: windows-latest
            tests: test_plugin_installers_windows.py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Test platform installer behavior
        run: uv run --no-project --python 3.12 --with pytest==9.0.2 python -m pytest umbod/scripts/tests/${{ matrix.tests }} -q
      - name: Verify literal PowerShell configuration binding
        if: matrix.os == 'windows-latest'
        run: uv run --no-project --python 3.12 --with pytest==9.0.2 --with 'pydantic>=2.13.4,<3' python -m pytest --noconftest --import-mode=importlib -o pythonpath=src umbod/api/tests/umbod/core/harness_plugins/test_installers.py -k powershell_binding_executes -q

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: umbod Backend Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: umbod/api
    steps:
      - uses: useblacksmith/checkout@v1

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: umbod/api/uv.lock

      - name: Install backend dependencies
        run: uv sync --locked

      - name: Run complete backend test suite
        run: uv run --locked pytest tests -q -n auto --dist=worksteal --cov --cov-report=xml:coverage.xml --durations=30 --durations-min=0.1

      - name: Save backend coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-coverage
          path: umbod/api/coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload backend coverage
        uses: codecov/codecov-action@4481f553995cc5011b158ce191746ac1a1d0f815
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: umbod/api/coverage.xml
          flags: backend
          disable_search: true
          fail_ci_if_error: false

  script-tests:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    name: Repository script tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: umbod/api
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: umbod/api/uv.lock
      - name: Test repository scripts
        env:
          PYTHONPATH: ..
        run: >-
          uv run --locked pytest ../scripts/tests -q
          --ignore=../scripts/tests/test_plugin_installers.py
          --ignore=../scripts/tests/test_plugin_installers_windows.py
          --ignore=../scripts/tests/test_release_versions.py
          --ignore=../scripts/tests/test_release_workflow.py
          --ignore=../scripts/tests/test_website_deployment.py

  core:
    name: umbod Core Docker Build
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1

      - name: Build image
        uses: ./.github/actions/docker-build
        with:
          context: .
          file: umbod/api/Dockerfile
          cache-scope: umbod
          tags: ghcr.io/computerlovetech/umbod:ci

  connector-builder:
    needs: changes
    if: needs.changes.outputs.connector == 'true'
    name: umbod Connector Builder Image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1

      - name: Build image
        run: |
          docker build \
            --build-arg UMBOD_RELEASE=ci \
            --file packages/umbod-sdk/Dockerfile \
            --tag ghcr.io/computerlovetech/umbod-connector-builder:ci \
            .

      - name: Verify SDK and build tools
        run: |
          docker run --rm ghcr.io/computerlovetech/umbod-connector-builder:ci \
            python -c 'import umbod_sdk.connectors; import os; assert os.environ["UMBOD_RELEASE"] == "ci"'
          docker run --rm ghcr.io/computerlovetech/umbod-connector-builder:ci uv --version

  frontend:
    name: umbod Frontend Docker Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: umbod/frontend
        run: bun install --frozen-lockfile

      - name: Run complete frontend test suite
        working-directory: umbod/frontend
        run: bun run test --coverage

      - name: Save frontend coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-coverage
          path: umbod/frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

      - name: Upload frontend coverage
        uses: codecov/codecov-action@4481f553995cc5011b158ce191746ac1a1d0f815
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: umbod/frontend/coverage/lcov.info
          flags: frontend
          disable_search: true
          fail_ci_if_error: false

      - name: Check frontend
        working-directory: umbod/frontend
        run: bun run check

      - name: Build image
        uses: ./.github/actions/docker-build
        with:
          context: umbod/frontend
          cache-scope: umbod-frontend
          tags: ghcr.io/computerlovetech/umbod-frontend:ci

  helm:
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    name: umbod Helm Chart
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: umbod
    steps:
      - uses: useblacksmith/checkout@v1

      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3

      - name: Lint chart
        run: helm lint --strict deploy/helm/umbod -f deploy/helm/umbod/ci/ci-values.yaml

      - name: Render chart
        run: helm template umbod deploy/helm/umbod -f deploy/helm/umbod/ci/ci-values.yaml > rendered.yaml

      - name: Validate rendered architecture
        run: python3 deploy/helm/umbod/scripts/validate-rendered.py rendered.yaml

      - name: Verify schema rejects unsupported core replicas
        run: |
          if helm template umbod deploy/helm/umbod --set core.replicaCount=2 > /dev/null 2> schema-error.txt; then
            echo "Schema accepted unsupported core replica count"
            exit 1
          fi
          grep -q "core.replicaCount" schema-error.txt

      - name: Package chart
        run: helm package deploy/helm/umbod --destination chart-package

  helm-kubernetes-schema:
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    name: umbod Helm Chart (Kubernetes ${{ matrix.kubernetes-version }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version:
          - '1.25.0'
          - '1.32.0'
          - '1.33.0'
          - '1.34.0'
    defaults:
      run:
        working-directory: umbod
    steps:
      - uses: useblacksmith/checkout@v1

      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3

      - name: Render chart
        run: helm template umbod deploy/helm/umbod -f deploy/helm/umbod/ci/ci-values.yaml > rendered.yaml

      - name: Validate Kubernetes schemas
        run: >-
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7
          -kubernetes-version ${{ matrix.kubernetes-version }}
          -strict
          -summary
          < rendered.yaml

  helm-kind-install:
    name: umbod Helm Chart Kind Install
    needs: changes
    if: needs.changes.outputs.kind == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: umbod
    steps:
      - uses: useblacksmith/checkout@v1

      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3

      - uses: helm/kind-action@v1.12.0
        with:
          install_only: true
          version: v0.27.0

      - name: Install and test chart in Kind
        run: bash deploy/helm/umbod/scripts/kind-install-test.sh

  ci-complete:
    name: umbod CI
    needs: [harness-linting, changes, docs, lint, semgrep, sdk-tests, backend-tests, script-tests, plugin-installers, core, connector-builder, frontend, helm, helm-kubernetes-schema, helm-kind-install]
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: umbod-ci
    steps:
      - name: Fail if any required job failed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["JOB_RESULTS"])
          for name in ("harness-linting", "changes"):
              if jobs[name]["result"] != "success":
                  sys.exit(f"Required job did not succeed: {name}")
          selections = jobs["changes"]["outputs"]
          filters = {
              "docs": "website",
              "lint": "lint",
              "semgrep": "semgrep",
              "sdk-tests": "sdk",
              "backend-tests": "backend",
              "script-tests": "scripts",
              "plugin-installers": "installers",
              "core": "core",
              "connector-builder": "connector",
              "frontend": "frontend",
              "helm": "helm",
              "helm-kubernetes-schema": "helm",
              "helm-kind-install": "kind",
          }
          for name, component in filters.items():
              selected = selections.get(component)
              if selected not in ("true", "false"):
                  sys.exit(f"Missing or invalid change detection: {component}")
              expected = "success" if selected == "true" else "skipped"
              if jobs[name]["result"] != expected:
                  sys.exit(f"Unexpected result for {name}: {jobs[name]['result']}")
          PY

  publish-main-images:
    name: Publish ${{ matrix.name }} main image
    needs: [ci-complete, changes]
    if: >-
      ${{
        !cancelled() &&
        needs.ci-complete.result == 'success' &&
        (needs.changes.outputs.core == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.connector == 'true') &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        github.repository == 'computerlovetech/umbod'
      }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: connector-builder, image: ghcr.io/computerlovetech/umbod-connector-builder, context: ., file: packages/umbod-sdk/Dockerfile, cache: umbod-connector-builder-release}
          - {name: core, image: ghcr.io/computerlovetech/umbod, context: ., file: umbod/api/Dockerfile, cache: umbod-release}
          - {name: frontend, image: ghcr.io/computerlovetech/umbod-frontend, context: umbod/frontend, file: umbod/frontend/Dockerfile, cache: umbod-frontend-release}
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: docker/setup-qemu-action@v4
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: useblacksmith/build-push-action@v2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.image }}:main-${{ github.sha }}
          build-args: ${{ matrix.name == 'connector-builder' && format('UMBOD_RELEASE=main-{0}', github.sha) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=main-${{ github.sha }}
      - name: Verify published manifest
        run: docker buildx imagetools inspect "${{ matrix.image }}:main-${{ github.sha }}"

  promote-nightly-images:
    name: Promote main images to nightly
    needs: publish-main-images
    if: >-
      ${{
        !cancelled() &&
        needs.publish-main-images.result == 'success' &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        github.repository == 'computerlovetech/umbod'
      }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      packages: write
    steps:
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Promote and verify image manifests
        shell: bash
        run: |
          set -euo pipefail
          for image in ghcr.io/computerlovetech/umbod-connector-builder ghcr.io/computerlovetech/umbod ghcr.io/computerlovetech/umbod-frontend; do
            docker buildx imagetools create --tag "${image}:nightly" "${image}:main-${GITHUB_SHA}"
            docker buildx imagetools inspect "${image}:nightly"
          done
