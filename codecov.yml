codecov:
  notify:
    after_n_builds: 3
    wait_for_ci: true

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment: false

github_checks:
  annotations: false

fixes:
  - '^(?:src/)?umbod/(?!api/src/|frontend/src/)::umbod/api/src/umbod/'
  - '^(?:src/)?messaging/::umbod/api/src/messaging/'
  - '^(?:src/)?umbod_sdk/::packages/umbod-sdk/src/umbod_sdk/'
  - '^src/::umbod/frontend/src/'

flags:
  backend:
    paths:
      - umbod/api/src/
    carryforward: false
  sdk:
    paths:
      - packages/umbod-sdk/src/
    carryforward: false
  frontend:
    paths:
      - umbod/frontend/src/
    carryforward: false
