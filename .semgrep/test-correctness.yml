rules:
  - id: python.tests.review-patching
    languages: [python]
    severity: WARNING
    message: >-
      Test design review: is patching needed in this context? Patching may couple the test to
      implementation details or bypass real behavior. When a focused test needs private patching,
      investigate a missing dependency-injection seam. Prefer existing public operations and injected
      or recording fakes when isolation is preserved. Boundary isolation, failure simulation, or
      framework integration may justify retaining patching. Do not add abstractions merely to
      eliminate mocks.
    paths:
      include:
        - '**/tests/**'
        - '**/live_runtime_tests/**'
        - '**/test_*.py'
        - '**/*_test.py'
        - '**/conftest.py'
    metadata:
      reviewed-boundaries:
        - target: fastmcp.server.auth.oidc_proxy.httpx2.get
          replacement: return_value
          reason: Isolates upstream OIDC discovery HTTP without replacing Umbod authentication behavior.
        - target: umbod.rest.metrics.http_server.Server
          replacements: [FailingServer, CapturingServer, RestartableServer]
          reason: Deterministic Uvicorn failure, configuration capture, and lifecycle simulation.
        - target: umbod.rest.metrics.http_server.Config
          replacement: CapturingConfig
          reason: Records Uvicorn bind configuration while preserving the real metrics lifecycle wrapper.
    patterns:
      - pattern-either:
          - pattern: unittest.mock.patch(...)
          - patterns:
              - pattern: unittest.mock.patch.$METHOD(...)
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: '^(object|dict|multiple)$'
          - patterns:
              - pattern-either:
                  - pattern: mock.patch(...)
                  - patterns:
                      - pattern: mock.patch.$METHOD(...)
                      - metavariable-regex:
                          metavariable: $METHOD
                          regex: '^(object|dict|multiple)$'
              - pattern-either:
                  - pattern-inside: |
                      import mock
                      ...
                  - pattern-inside: |
                      from mock import patch
                      ...
          - patterns:
              - pattern-either:
                  - pattern: $FIXTURE.patch(...)
                  - patterns:
                      - pattern: $FIXTURE.patch.$METHOD(...)
                      - metavariable-regex:
                          metavariable: $METHOD
                          regex: '^(object|dict|multiple)$'
              - metavariable-regex:
                  metavariable: $FIXTURE
                  regex: '^(mocker|session_mocker|module_mocker|class_mocker|package_mocker)$'
      - pattern-not: unittest.mock.patch("fastmcp.server.auth.oidc_proxy.httpx2.get", return_value=$RESPONSE)
      - pattern-not: unittest.mock.patch("umbod.rest.metrics.http_server.Server", FailingServer)
      - pattern-not: unittest.mock.patch("umbod.rest.metrics.http_server.Server", CapturingServer)
      - pattern-not: unittest.mock.patch("umbod.rest.metrics.http_server.Server", RestartableServer)
      - pattern-not: unittest.mock.patch("umbod.rest.metrics.http_server.Config", CapturingConfig)

  - id: python.tests.review-private-monkeypatch
    languages: [python]
    severity: WARNING
    message: >-
      Test design review: is private monkeypatching needed in this context? Patching may couple the
      test to implementation details or bypass real behavior. When a focused test needs private
      patching, investigate a missing dependency-injection seam. Prefer existing public operations
      and injected or recording fakes when isolation is preserved. Boundary isolation, failure
      simulation, or framework integration may justify retaining patching. Do not add abstractions
      merely to eliminate mocks.
    paths:
      include:
        - '**/tests/**'
        - '**/live_runtime_tests/**'
        - '**/test_*.py'
        - '**/*_test.py'
        - '**/conftest.py'
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: monkeypatch.setattr($OBJECT, $ATTRIBUTE, $VALUE, ...)
              - pattern: monkeypatch.delattr($OBJECT, $ATTRIBUTE, ...)
          - metavariable-regex:
              metavariable: $ATTRIBUTE
              regex: "^['\"]_(?!_)[A-Za-z0-9_]*['\"]$"
      - patterns:
          - pattern-either:
              - pattern: monkeypatch.setattr($TARGET, $VALUE, ...)
              - pattern: monkeypatch.delattr($TARGET, ...)
          - metavariable-regex:
              metavariable: $TARGET
              regex: "^['\"][^'\"]+\\._(?!_)[A-Za-z0-9_]*['\"]$"

  - id: python.tests.no-mutable-parameter-defaults
    languages: [python]
    severity: ERROR
    message: >-
      Mutable parameter defaults share state between test calls and cases. Allocate fresh values
      per call or require an explicit argument; preserve explicitly supplied empty containers.
    paths:
      include:
        - '**/tests/**'
        - '**/live_runtime_tests/**'
        - '**/test_*.py'
        - '**/*_test.py'
        - '**/conftest.py'
    patterns:
      - pattern: |
          def $FUNCTION(..., $PARAM=$DEFAULT, ...):
            ...
      - metavariable-pattern:
          metavariable: $DEFAULT
          pattern-either:
            - pattern: '[...]'
            - pattern: '{...}'
            - pattern: '{$ITEM, ...}'
            - pattern: dict(...)
            - pattern: list(...)
            - pattern: set(...)
            - pattern: '[$ITEM for $TARGET in $ITERABLE]'
            - pattern: '{$KEY: $VALUE for $TARGET in $ITERABLE}'
            - pattern: '{$ITEM for $TARGET in $ITERABLE}'

  - id: python.tests.review-container-truthiness-default
    languages: [python]
    severity: WARNING
    message: >-
      Test helper review: this fallback treats an explicitly supplied empty container as absent.
      When empty arguments or an empty schema are valid scenario inputs, default only on None.
      Retain this expression if empty and missing inputs intentionally have the same meaning.
    paths:
      include:
        - '**/tests/**'
        - '**/live_runtime_tests/**'
        - '**/test_*.py'
        - '**/*_test.py'
        - '**/conftest.py'
    patterns:
      - pattern-either:
          - pattern-inside: |
              def $FUNCTION(..., $PARAM: $CONTAINER[...] | None, ...):
                ...
          - pattern-inside: |
              def $FUNCTION(..., $PARAM: None | $CONTAINER[...], ...):
                ...
          - pattern-inside: |
              def $FUNCTION(..., $PARAM: Optional[$CONTAINER[...]], ...):
                ...
          - pattern-inside: |
              def $FUNCTION(..., $PARAM: Union[$CONTAINER[...], None], ...):
                ...
          - pattern-inside: |
              def $FUNCTION(..., $PARAM: Union[None, $CONTAINER[...]], ...):
                ...
      - metavariable-regex:
          metavariable: $CONTAINER
          regex: '^(dict|list|set|Dict|List|Set|Mapping|Sequence|MutableMapping|MutableSequence|typing\.(Dict|List|Set|Mapping|Sequence|MutableMapping|MutableSequence)|collections\.abc\.(Mapping|Sequence|MutableMapping|MutableSequence))$'
      - pattern: $PARAM or $FALLBACK
      - pattern-not: $PARAM or {}
      - pattern-not: $PARAM or []
      - pattern-not: $PARAM or dict()
      - pattern-not: $PARAM or list()
      - pattern-not: $PARAM or set()

  - id: python.tests.no-business-sqlite-backend-imports
    languages: [python]
    severity: ERROR
    message: Business and configuration tests must not import physical SQLite backends or dual-driver registries.
    paths:
      include:
        - '**/tests/umbod/core/**'
        - '**/tests/umbod/rest/**'
        - '**/tests/umbod/mcp/**'
        - '**/tests/umbod/cli/**'
        - '**/tests/umbod/hosting/**'
        - '**/tests/messaging/**'
        - '**/tests/umbod/config/**'
      exclude:
        - '**/tests/umbod/hosting/integration/test_api_server_process.py'
        - '**/tests/umbod/core/persistence/test_driver_package_imports.py'
    pattern-either:
      - pattern: import sqlite3
      - pattern: import aiosqlite
      - patterns:
          - pattern: from $MODULE import $MEMBER
          - metavariable-regex:
              metavariable: $MODULE
              regex: '(^|.*\.)(sqlite|sqlite3|aiosqlite)(\..*)?$'
      - patterns:
          - pattern: import $MODULE
          - metavariable-regex:
              metavariable: $MODULE
              regex: '(^|.*\.)(sqlite|sqlite3|aiosqlite)(\..*)?$'
      - patterns:
          - pattern: from $MODULE import $MEMBER
          - metavariable-regex:
              metavariable: $MEMBER
              regex: '^(create_sqlite_.*|prepared_sqlite_.*|SQLiteDatabase|SqliteDatabase|SQLiteConnectionDriver)$'
      - pattern: from $MODULE import DATABASE_ADAPTERS
      - pattern: from tests.umbod.infrastructure.persistence.adapters import $MEMBER

  - id: python.tests.no-business-sqlite-runtime
    languages: [python]
    severity: ERROR
    message: Use the in-memory persistence runtime outside physical-driver tests and the exact host-process integration.
    paths:
      include:
        - '**/tests/umbod/core/**'
        - '**/tests/umbod/rest/**'
        - '**/tests/umbod/mcp/**'
        - '**/tests/umbod/cli/**'
        - '**/tests/umbod/hosting/**'
        - '**/tests/messaging/**'
        - '**/tests/umbod/config/**'
      exclude:
        - '**/tests/umbod/hosting/integration/test_api_server_process.py'
    pattern-either:
      - pattern: sqlite3.connect(...)
      - pattern: aiosqlite.connect(...)
      - pattern: SQLiteDatabase(...)
      - pattern: SqliteDatabase(...)
      - pattern: SQLiteConnectionDriver(...)
      - pattern: create_sqlite_runtime(...)
      - pattern: prepared_sqlite_runtime(...)
      - pattern: create_sqlite_analytics_runtime(...)
      - patterns:
          - pattern: $OBJECT.$FACTORY(...)
          - metavariable-regex:
              metavariable: $FACTORY
              regex: '^(create_sqlite_.*|prepared_sqlite_.*|SQLiteDatabase|SqliteDatabase|SQLiteConnectionDriver)$'

  - id: python.tests.no-business-sqlite-configuration
    languages: [python]
    severity: ERROR
    message: SQLite configuration and physical fixture policy belong in configuration or infrastructure tests, not business tests.
    metadata:
      reviewed-boundaries:
        - path: api/tests/umbod/hosting/integration/test_mcp_server_process.py
          reason: Real CLI startup, reload and signal shutdown exercise configured persistent hosting without replacing composition.
    paths:
      include:
        - '**/tests/umbod/core/**'
        - '**/tests/umbod/rest/**'
        - '**/tests/umbod/mcp/**'
        - '**/tests/umbod/cli/**'
        - '**/tests/umbod/hosting/**'
        - '**/tests/messaging/**'
        - '**/tests/umbod/config/**'
      exclude:
        - '**/tests/umbod/hosting/integration/test_api_server_process.py'
        - '**/tests/umbod/hosting/integration/test_mcp_server_process.py'
        - '**/tests/umbod/config/**'
    pattern-either:
      - pattern: $CONFIG.sqlite_path
      - pattern: SQLiteConnectorStoreConfig(...)
      - pattern: ConnectorStoreConfig(..., type="sqlite", ...)
      - pattern: TelemetryAnalyticsConfig(..., enabled=True, ...)
      - patterns:
          - pattern: $CONFIG(..., sqlite_path=$PATH, ...)
          - metavariable-regex:
              metavariable: $CONFIG
              regex: '.*Config$'
      - pattern: '{..., "connector_store": {..., "type": "sqlite", ...}, ...}'
      - pattern: '{..., "analytics": {..., "enabled": True, ...}, ...}'
      - pattern: '{..., "telemetry_analytics": {..., "enabled": True, ...}, ...}'
      - pattern: '$CONFIG(..., telemetry_analytics={..., "enabled": True, ...}, ...)'
      - pattern: 'TelemetryAnalyticsConfig.model_validate({..., "enabled": True, ...}, ...)'
      - pattern: TelemetryAnalyticsConfig.model_construct(..., enabled=True, ...)
      - pattern: 'TelemetryAnalyticsConfig.model_copy(..., update={..., "enabled": True, ...}, ...)'
      - pattern: os.environ["UMBOD_CONNECTOR_STORE"] = "sqlite"
      - pattern: $PATCH.setenv("UMBOD_CONNECTOR_STORE", "sqlite")
      - pattern: $PATCH.setitem(os.environ, "UMBOD_CONNECTOR_STORE", "sqlite")
      - pattern: $HELPER(..., UMBOD_CONNECTOR_STORE="sqlite", ...)
      - patterns:
          - pattern: $HELPER(..., UMBOD_TELEMETRY_ANALYTICS_ENABLED=$VALUE, ...)
          - metavariable-regex:
              metavariable: $VALUE
              regex: '^([''\"](?i:true|1)[''\"]|True|1)$'
      - patterns:
          - pattern-either:
              - pattern: os.environ[$KEY] = $VALUE
              - pattern: $PATCH.setenv($KEY, $VALUE)
              - pattern: '{$KEY: $VALUE, ...}'
          - metavariable-regex:
              metavariable: $KEY
              regex: '^[''"]UMBOD_.*SQLITE.*PATH[''"]$'
      - patterns:
          - pattern-either:
              - pattern: os.environ["UMBOD_TELEMETRY_ANALYTICS_ENABLED"] = $VALUE
              - pattern: $PATCH.setenv("UMBOD_TELEMETRY_ANALYTICS_ENABLED", $VALUE)
              - pattern: '{..., "UMBOD_TELEMETRY_ANALYTICS_ENABLED": $VALUE, ...}'
          - metavariable-regex:
              metavariable: $VALUE
              regex: '^([''"](?i:true|1)[''"]|True|1)$'
      - pattern: '{..., "UMBOD_CONNECTOR_STORE": "sqlite", ...}'
      - pattern: |
          def $FUNCTION(..., prepared_connector_store_database, ...):
            ...
      - pattern: |
          def $FUNCTION(..., isolated_connector_store_database, ...):
            ...

  - id: python.tests.no-config-policy-runtime-construction
    languages: [python]
    severity: ERROR
    message: Configuration policy tests may validate backend configuration but must not construct persistence runtimes.
    paths:
      include:
        - '**/tests/umbod/config/**'
    pattern-either:
      - pattern: ConfiguredPersistenceRuntimeProvider(...)
      - pattern: create_configured_analytics_runtime(...)
      - pattern: $MODULE.ConfiguredPersistenceRuntimeProvider(...)
      - pattern: $MODULE.create_configured_analytics_runtime(...)
