  - id: python.function-argument-none-type
    metadata:
      protocol_contract_exceptions:
        - contract: __aexit__(self, exc_type, exc, traceback)
          reason: Python context managers receive three None values on normal exit and must forward exceptions and suppression unchanged.
      compatibility_boundary_exceptions:
        - function: umbod.hosting.applications.create_rest_app
          reason: Public hosting hooks preserve plugin discovery, configured verification, and absent host OAuth override semantics.
        - function: umbod.hosting.applications.create_mcp_app
          reason: Public hosting hooks use None to retain configured authentication, permission projection, and telemetry sink.
        - function: umbod.mcp.public_app.build_mcp
          reason: Legacy composition entrypoint normalizes absent authentication into an explicit unauthenticated transport before internal construction.
      framework_contract_exceptions:
        - contract: httpcore.AsyncNetworkBackend
          methods: [connect_tcp, connect_unix_socket]
          reason: Overrides must preserve HTTP transport timeout, local binding, and socket option absence semantics.
        - contract: httpcore2.AsyncNetworkBackend
          methods: [connect_tcp, connect_unix_socket]
          reason: Overrides must preserve HTTP transport timeout, local binding, and socket option absence semantics.
        - contract: httpcore2.AsyncNetworkStream
          methods: [read, write, start_tls]
          reason: Overrides must preserve transport timeout and TLS server hostname absence semantics.
    languages:
      - python
    severity: WARNING
    message: >-
      Design warning: function or method argument '$PARAM' allows None. Treat uncertainty about missing
      values as a boundary validation concern rather than a downstream core-logic concern. Validate and
      normalize inputs at API, CLI, config, file, or adapter edges, then pass required values internally. If
      None represents a separate state, model that state explicitly with separate DTOs or domain types rather
      than adding None checks throughout the core.
    paths:
      include:
        - '**/api/src/**'
        - '**/frontend/src/**'
        - '**/src/**'
      exclude:
        - '**/tests/**'
        - '**/live_runtime_tests/**'
        - '**/test_*.py'
        - '**/*_test.py'
        - '**/conftest.py'
        - '**/api/src/umbod/hosting/applications.py'
        - '**/api/src/umbod/mcp/public_app.py'
    patterns:
      - pattern-either:
          - pattern: |
              def $FUNCTION(..., $PARAM: Optional[$TYPE], ...):
                ...
          - pattern: |
              def $FUNCTION(..., $PARAM: Union[$TYPE, None], ...):
                ...
          - pattern: |
              def $FUNCTION(..., $PARAM: Union[None, $TYPE], ...):
                ...
          - pattern: |
              def $FUNCTION(..., $PARAM: $TYPE | None, ...):
                ...
          - pattern: |
              def $FUNCTION(..., $PARAM: None | $TYPE, ...):
                ...
          - pattern: |
              def $FUNCTION(..., $PARAM: $TYPE = None, ...):
                ...
      - pattern-not-inside: |
          def __aexit__(self, exc_type: type[BaseException] | None, exc: BaseException | None, traceback: types.TracebackType | None):
            ...
      - pattern-either:
          - patterns:
              - pattern: |
                  def $FUNCTION(...):
                    ...
              - pattern-not-inside: |
                  class $CLASS(httpcore.AsyncNetworkBackend):
                    ...
              - pattern-not-inside: |
                  class $CLASS(httpcore2.AsyncNetworkBackend):
                    ...
              - pattern-not-inside: |
                  class $CLASS(httpcore2.AsyncNetworkStream):
                    ...
          - patterns:
              - pattern: |
                  def $FUNCTION(...):
                    ...
              - pattern-inside: |
                  class $CLASS(httpcore.AsyncNetworkBackend):
                    ...
              - metavariable-regex:
                  metavariable: $FUNCTION
                  regex: '^(?!(connect_tcp|connect_unix_socket)$).*'
          - patterns:
              - pattern: |
                  def $FUNCTION(...):
                    ...
              - pattern-inside: |
                  class $CLASS(httpcore2.AsyncNetworkBackend):
                    ...
              - metavariable-regex:
                  metavariable: $FUNCTION
                  regex: '^(?!(connect_tcp|connect_unix_socket)$).*'
          - patterns:
              - pattern: |
                  def $FUNCTION(...):
                    ...
              - pattern-inside: |
                  class $CLASS(httpcore2.AsyncNetworkStream):
                    ...
              - metavariable-regex:
                  metavariable: $FUNCTION
                  regex: '^(?!(read|write|start_tls)$).*'

