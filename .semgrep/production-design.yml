rules:
  - id: frontend.use-shared-select
    languages: [regex]
    severity: ERROR
    message: Use the shared Select component from $lib/components/admin/shared/Select.svelte instead of a native <select> for consistent dropdown behavior.
    paths:
      include:
        - '**/frontend/src/**/*.svelte'
      exclude:
        - '**/frontend/src/**/*.test-support.svelte'
        - '**/frontend/src/lib/components/admin/shared/Select.svelte'
    pattern-regex: '<select(?=[\s/>])'

  - id: python.metrics.infrastructure-only-prometheus
    languages: [python]
    severity: ERROR
    message: Keep Prometheus imports in infrastructure adapters; application metrics depend on recording ports.
    paths:
      include:
        - '**/api/src/umbod/**'
      exclude:
        - '**/api/src/umbod/infrastructure/**'
    patterns:
      - pattern-either:
          - pattern: import $MODULE
          - pattern: from $MODULE import $NAME
      - metavariable-regex:
          metavariable: $MODULE
          regex: '^prometheus_client(?:\.|$)'

  - id: python.diagnostics.publish-side-effects
    languages: [python]
    severity: ERROR
    message: >-
      Application failure producers publish typed events through an injected SignalPublisher.
      Put logging in a registered receiver, not the operation; only dispatch-failure infrastructure
      may use the nonrecursive direct-logging fallback.
    paths:
      include:
        - '**/api/src/umbod/core/diagnostics/**'
        - '**/api/src/umbod/rest/metrics/middleware.py'
        - '**/api/src/umbod/mcp/logging/audit/recorder.py'
        - '**/api/src/umbod/mcp/connectors/openapi/codemode_execution.py'
    pattern-either:
      - pattern: import logging
      - pattern: from logging import $NAME
      - pattern: import umbod.logging
      - pattern: from umbod.logging import $NAME
      - patterns:
          - pattern: $LOGGER.$METHOD(...)
          - metavariable-regex:
              metavariable: $LOGGER
              regex: '^(logging|logger|log|.*[._]logger)$'
          - metavariable-regex:
              metavariable: $METHOD
              regex: '^(debug|info|warning|error|critical|exception|log)$'

  - id: python.logging.no-raw-exception
    languages: [python]
    severity: ERROR
    message: >-
      Use the safe application failure event boundary instead of logger.exception or exc_info.
      Record an allowlisted operation and reason with sanitized exception evidence, not raw exception text.
    paths:
      include:
        - '**/api/src/**'
        - '**/src/**'
      exclude:
        - '**/tests/**'
        - '**/live_runtime_tests/**'
        - '**/test_*.py'
        - '**/*_test.py'
        - '**/conftest.py'
    patterns:
      - pattern-either:
          - pattern: $LOGGER.exception(...)
          - pattern: $LOGGER.$METHOD(..., exc_info=$VALUE, ...)
      - metavariable-regex:
          metavariable: $LOGGER
          regex: '^(logging|logger|log|.*[._]logger)$'

  - id: python.logging.no-dynamic-message
    languages: [python]
    severity: ERROR
    message: >-
      Log messages must be fixed event descriptions. Put approved diagnostic values in typed,
      allowlisted fields; do not interpolate exceptions, payloads, credentials, or URLs into messages.
    paths:
      include:
        - '**/api/src/**'
        - '**/src/**'
      exclude:
        - '**/tests/**'
        - '**/live_runtime_tests/**'
        - '**/test_*.py'
        - '**/*_test.py'
        - '**/conftest.py'
    patterns:
      - pattern-either:
          - pattern: $LOGGER.$METHOD(f"...", ...)
          - pattern: $LOGGER.$METHOD($MESSAGE, $ARGUMENT, ...)
          - pattern: $LOGGER.$METHOD($MESSAGE.format(...), ...)
          - pattern: $LOGGER.$METHOD($MESSAGE % $VALUE, ...)
          - pattern: $LOGGER.$METHOD(str(...), ...)
      - metavariable-regex:
          metavariable: $LOGGER
          regex: '^(logging|logger|log|.*[._]logger)$'
      - metavariable-regex:
          metavariable: $METHOD
          regex: '^(debug|info|warning|error|critical|exception)$'

  - id: python.no-parameter-default-values
    languages:
      - python
    severity: ERROR
    message: >-
      Harness metric violation: function or method parameters must not define default values. Start a
      Refactorer subagent for this file. Subagent prompt: Refactor the reported file to remove parameter
      default values from function and method signatures. Move defaults to the call site, configuration
      boundary, typed option object, or explicit argument resolver while preserving public behavior. Keep the
      change focused, avoid broad rewrites, and run the relevant targeted tests plus Semgrep for this file.
    paths:
      include:
        - '**/api/src/**'
        - '**/frontend/src/**'
        - '**/src/**'
      exclude:
        - '**/tests/**'
        - '**/live_runtime_tests/**'
        - '**/test_*.py'
        - '**/*_test.py'
        - '**/conftest.py'
    patterns:
      - pattern: |
          def $FUNCTION(..., $PARAM=$DEFAULT, ...):
            ...
      - pattern-not: |
          def $FUNCTION(..., $PARAM=Depends(...), ...):
            ...
      - pattern-not: |
          def $FUNCTION(..., $PARAM=fastapi.Depends(...), ...):
            ...

  - id: python.fastapi.no-app-state-dependencies
    languages:
      - python
    severity: ERROR
    message: >-
      Harness metric violation: FastAPI routes must not use app.state to store or retrieve dependencies.
      Start a Refactorer subagent for this file. Subagent prompt: Refactor the reported file to remove app.state
      dependencies from FastAPI routes. Use Depends for dependency injection and inject factory instances that
      create the route dependencies. Preserve public behavior, keep the change focused, and run the relevant
      targeted tests plus Semgrep for this file.
    paths:
      include:
        - '**/api/src/**'
      exclude:
        - '**/tests/**'
        - '**/live_runtime_tests/**'
        - '**/test_*.py'
        - '**/*_test.py'
        - '**/conftest.py'
    patterns:
      - pattern-either:
          - pattern: $REQUEST.app.state.$DEPENDENCY
          - patterns:
              - pattern: $APP.state.$DEPENDENCY
              - pattern-either:
                  - pattern-inside: |
                      def $FUNCTION(..., $APP: fastapi.FastAPI, ...):
                        ...
                  - pattern-inside: |
                      def $FUNCTION(..., $APP: starlette.applications.Starlette, ...):
                        ...
                  - pattern-inside: |
                      $APP = fastapi.FastAPI(...)
                      ...
                  - pattern-inside: |
                      $APP = starlette.applications.Starlette(...)
                      ...
                  - pattern-inside: |
                      $APP: fastapi.FastAPI = ...
                      ...
                  - pattern-inside: |
                      $APP: starlette.applications.Starlette = ...
                      ...
      - pattern-inside: |
          def $FUNCTION(...):
            ...

  - id: dataclass-with-methods
    languages: [python]
    severity: WARNING
    message: >
      Dataclass '$CLASS' contains method '$METHOD'.

      Classify this as GOOD or BAD use of dataclasses using these principles:
        - BAD: the method encodes a business rule, state transition, or domain operation
        - BAD: the method orchestrates external services, triggers I/O, or causes side effects
        - BAD: the method would make sense as a standalone function that takes this dataclass as input
        - GOOD: a computed property or simple data derivation
        - GOOD: a factory or serialiser (from_dict, to_json, formatted)

      If BAD: refactor the method out to a service or standalone function that accepts this dataclass as an argument.
      If GOOD: leave unchanged.
    paths:
      include:
        - '**/api/src/**'
        - '**/frontend/src/**'
        - '**/src/**'
      exclude:
        - '**/tests/**'
        - '**/live_runtime_tests/**'
        - '**/test_*.py'
        - '**/*_test.py'
        - '**/conftest.py'
    patterns:
      - pattern-inside: |
          @dataclass
          class $CLASS:
            ...
      - pattern: |
          def $METHOD(self, ...):
            ...
      - pattern-not: |
          @property
          def $METHOD(self, ...):
            ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(?!__).*

  - id: python.dataclass.none-type-field
    languages:
      - python
    severity: WARNING
    message: >-
      Design warning: dataclass field '$FIELD' allows None. Assume presence of values in internal core
      models and validate missing or optional values at the edge of the system, such as API, CLI, config,
      file, or external-service input boundaries. If None represents a different state, model that state
      explicitly with a separate DTO or domain type instead of allowing None to spread downstream. Many
      None-able fields in one dataclass usually indicate the model should be split.
    paths:
      include:
        - '**/api/src/**'
        - '**/frontend/src/**'
        - '**/src/**'
      exclude:
        - '**/tests/**'
        - '**/live_runtime_tests/**'
        - '**/test_*.py'
        - '**/*_test.py'
        - '**/conftest.py'
    patterns:
      - pattern-inside: |
          @dataclass
          class $CLASS:
            ...
      - pattern-either:
          - pattern: "$FIELD: Optional[$TYPE]"
          - pattern: "$FIELD: Union[$TYPE, None]"
          - pattern: "$FIELD: Union[None, $TYPE]"
          - pattern: "$FIELD: $TYPE | None"
          - pattern: "$FIELD: None | $TYPE"
          - pattern: "$FIELD: $TYPE = None"

  - id: python.pydantic.use-model-proxy
    languages: [python]
    severity: ERROR
    message: >-
      Direct Pydantic BaseModel imports belong only in umbod/proxies.py.
      Define Umbod models using `from umbod.proxies import Model`.
      For compatibility with external Pydantic models, use `is_pydantic_model_class` from umbod.proxies.
    paths:
      include:
        - '**/api/src/umbod/**'
      exclude:
        - '**/api/src/umbod/proxies.py'
    pattern-either:
      - pattern: from pydantic import BaseModel
      - pattern: from pydantic.main import BaseModel
      - pattern: from pydantic.v1 import BaseModel
      - pattern: from pydantic.v1.main import BaseModel
      - patterns:
          - pattern-either:
              - pattern: pydantic.BaseModel
              - pattern: pydantic.main.BaseModel
              - pattern: pydantic.v1.BaseModel
              - pattern: pydantic.v1.main.BaseModel
          - pattern-regex: '\b(?:[A-Za-z_]\w*\.)+BaseModel\b'
      - pattern: |
          class $CLASS(..., umbod.proxies.PydanticModel, ...):
            ...

  - id: python.pydantic.none-type-field
    metadata:
      boundary_model_exceptions:
        - model: umbod.core.connectors.downstream_mcp.adapters.fastmcp.oauth_storage.AuthorizationDocument
          reason: Legacy serialized SDK credential document preserves missing registration, tokens, provider expiry, and discovery data.
        - model: umbod.rest.connectors.downstream_mcp.oauth.BeginRequest
          reason: Null retains configured scopes while an empty string explicitly clears them.
        - model: umbod.rest.connectors.downstream_mcp.oauth.OAuthDetails
          reason: Public JSON distinguishes unavailable discovery or provider scope from explicit false and empty values.
    languages:
      - python
    severity: WARNING
    message: >-
      Design warning: Pydantic field '$FIELD' allows None. Prefer validating missing or optional user input
      at the API/request boundary and converting it into a required internal DTO before core logic sees it.
      If None means the model is in another state, split the model into explicit DTOs or domain types. Many
      None-able fields in one Pydantic model usually indicate the model has too many responsibilities.
    paths:
      include:
        - '**/api/src/**'
        - '**/frontend/src/**'
        - '**/src/**'
      exclude:
        - '**/tests/**'
        - '**/live_runtime_tests/**'
        - '**/test_*.py'
        - '**/*_test.py'
        - '**/conftest.py'
        - '**/api/src/umbod/core/connectors/downstream_mcp/adapters/fastmcp/oauth_storage.py'
        - '**/api/src/umbod/rest/connectors/downstream_mcp/oauth.py'
        - '**/api/src/umbod/core/connectors/native/models.py'
        - '**/api/src/umbod/core/connectors/openapi/execution/service.py'
        - '**/api/src/umbod/core/connectors/openapi/management/models.py'
        - '**/api/src/umbod/rest/connectors/native/schemas.py'
        - '**/api/src/umbod/rest/connectors/openapi/schemas.py'
        - '**/api/src/umbod/rest/connectors/schemas.py'
        - '**/api/src/umbod/mcp/connectors/native/prompts/registration.py'
        - '**/api/src/umbod/mcp/connectors/native/resources/registration.py'
        - '**/api/src/umbod/mcp/connectors/native/tools/registration.py'
        - '**/api/src/umbod/mcp/connectors/native/runtime_state.py'
        - '**/api/src/umbod/rest/mcp_permissions/schemas.py'
        - '**/api/src/umbod/rest/system/schemas.py'
        - '**/api/src/umbod/rest/users/responses.py'
    patterns: &pydantic_none_field_patterns
      - pattern-either:
          - pattern-inside: |
              class $CLASS(BaseModel):
                ...
          - pattern-inside: |
              class $CLASS(pydantic.BaseModel):
                ...
          - pattern-inside: |
              class $CLASS(umbod.proxies.Model):
                ...
          - pattern-inside: |
              class $CLASS(umbod.rest.proxies.Model):
                ...
          - pattern-inside: |
              class $CLASS(umbod.mcp.proxies.Model):
                ...
      - pattern-either:
          - pattern: "$FIELD: Optional[$TYPE]"
          - pattern: "$FIELD: Union[$TYPE, None]"
          - pattern: "$FIELD: Union[None, $TYPE]"
          - pattern: "$FIELD: $TYPE | None"
          - pattern: "$FIELD: None | $TYPE"
          - pattern: "$FIELD: $TYPE = None"
          - pattern: "$FIELD: Optional[$TYPE] = $VALUE"
          - pattern: "$FIELD: Union[$TYPE, None] = $VALUE"
          - pattern: "$FIELD: Union[None, $TYPE] = $VALUE"
          - pattern: "$FIELD: $TYPE | None = $VALUE"
          - pattern: "$FIELD: None | $TYPE = $VALUE"

  - id: python.pydantic.none-type-field.legacy-boundaries
    metadata:
      boundary_model_exceptions:
        - model: umbod.core.connectors.native.models.ConnectorExtension
          fields: [package]
          reason: Built-in registrations may have no installable package name.
        - model: umbod.core.connectors.native.models.ConnectorMetadata
          fields: [icon_data_url]
          reason: Connector registrations need not provide an icon; absent icons are omitted from output.
        - model: umbod.core.connectors.native.models.ConnectorConfigurationCheckResult
          fields: [message]
          reason: The existing connector check contract permits no diagnostic message.
        - model: umbod.core.connectors.openapi.execution.service.OpenApiCapabilityExecutionResult
          fields: [code, http_status, content_type]
          reason: An execution result can lack error details or an upstream HTTP response.
        - model: umbod.core.connectors.openapi.management.models.ImportOpenApiCatalog
          fields: [selected_server_url]
          reason: Import callers can defer server selection to the specification.
        - model: umbod.rest.connectors.native.schemas.ConnectorListItemResponse
          fields: [icon_data_url]
          reason: The response omits the icon when the connector provides none.
        - model: umbod.rest.connectors.native.schemas.ConnectorConfigurationPageResponse
          fields: [configuration]
          reason: Null represents a connector with no saved configuration.
        - model: umbod.rest.connectors.openapi.schemas.OpenApiConfigurationResponse
          fields: [masked_token]
          reason: Null represents a connector with no configured bearer token.
        - model: umbod.rest.connectors.schemas.ToolActivationBatchRequestItem
          fields: [activation_status, invocation_mode, expected_policy_revision]
          reason: Partial updates accept omitted policy changes or revision checks.
        - model: umbod.mcp.connectors.native.prompts.registration.ConnectorPromptRegistrationOptions
          fields: [connector_registrations]
          reason: Deployments without connector registrations skip prompt registration.
        - model: umbod.mcp.connectors.native.resources.registration.ConnectorResourceRegistrationOptions
          fields: [connector_registrations]
          reason: Deployments without connector registrations skip resource registration.
        - model: umbod.mcp.connectors.native.tools.registration.ConnectorToolRegistrationOptions
          fields: [connector_registrations, error_formatter]
          reason: Tool registration permits no connector registrations or no configured error formatter.
        - model: umbod.mcp.connectors.native.runtime_state.ConnectorRuntimeState
          fields: [display_name, configuration]
          reason: Runtime snapshots permit unavailable connector metadata and configuration.
        - model: umbod.rest.mcp_permissions.schemas.PermissionChangeResponse
          fields: [group_id, message]
          reason: The existing response permits an absent group identifier or diagnostic message.
        - model: umbod.rest.system.schemas.ConnectorRuntimeStateResponse
          fields: [display_name, configuration]
          reason: The runtime response preserves missing metadata and configuration.
        - model: umbod.rest.system.schemas.EventListQuery
          fields: [event_type]
          reason: Omitting event types requests events without a type filter.
        - model: umbod.rest.users.responses.CurrentUserResponse
          fields: [email, picture]
          reason: Identity providers need not supply an email address or picture.
    languages: [python]
    severity: WARNING
    message: >-
      Design warning: Pydantic field '$FIELD' allows None. Prefer validating missing or optional user input
      at the API/request boundary and converting it into a required internal DTO before core logic sees it.
      If None means the model is in another state, split the model into explicit DTOs or domain types. Many
      None-able fields in one Pydantic model usually indicate the model has too many responsibilities.
    paths:
      include:
        - '**/api/src/umbod/core/connectors/native/models.py'
        - '**/api/src/umbod/core/connectors/openapi/execution/service.py'
        - '**/api/src/umbod/core/connectors/openapi/management/models.py'
        - '**/api/src/umbod/rest/connectors/native/schemas.py'
        - '**/api/src/umbod/rest/connectors/openapi/schemas.py'
        - '**/api/src/umbod/rest/connectors/schemas.py'
        - '**/api/src/umbod/mcp/connectors/native/prompts/registration.py'
        - '**/api/src/umbod/mcp/connectors/native/resources/registration.py'
        - '**/api/src/umbod/mcp/connectors/native/tools/registration.py'
        - '**/api/src/umbod/mcp/connectors/native/runtime_state.py'
        - '**/api/src/umbod/rest/mcp_permissions/schemas.py'
        - '**/api/src/umbod/rest/system/schemas.py'
        - '**/api/src/umbod/rest/users/responses.py'
    patterns:
      - patterns: *pydantic_none_field_patterns
      - metavariable-comparison:
          metavariable: $CLASS
          comparison: >-
            not (
              (str($CLASS) == "ConnectorExtension" and str($FIELD) == "package") or
              (str($CLASS) == "ConnectorMetadata" and str($FIELD) == "icon_data_url") or
              (str($CLASS) == "ConnectorConfigurationCheckResult" and str($FIELD) == "message") or
              (str($CLASS) == "OpenApiCapabilityExecutionResult" and str($FIELD) in ["code", "http_status", "content_type"]) or
              (str($CLASS) == "ImportOpenApiCatalog" and str($FIELD) == "selected_server_url") or
              (str($CLASS) == "ConnectorListItemResponse" and str($FIELD) == "icon_data_url") or
              (str($CLASS) == "ConnectorConfigurationPageResponse" and str($FIELD) == "configuration") or
              (str($CLASS) == "OpenApiConfigurationResponse" and str($FIELD) == "masked_token") or
              (str($CLASS) == "ToolActivationBatchRequestItem" and str($FIELD) in ["activation_status", "invocation_mode", "expected_policy_revision"]) or
              (str($CLASS) == "ConnectorPromptRegistrationOptions" and str($FIELD) == "connector_registrations") or
              (str($CLASS) == "ConnectorResourceRegistrationOptions" and str($FIELD) == "connector_registrations") or
              (str($CLASS) == "ConnectorToolRegistrationOptions" and str($FIELD) in ["connector_registrations", "error_formatter"]) or
              (str($CLASS) == "ConnectorRuntimeState" and str($FIELD) in ["display_name", "configuration"]) or
              (str($CLASS) == "PermissionChangeResponse" and str($FIELD) in ["group_id", "message"]) or
              (str($CLASS) == "ConnectorRuntimeStateResponse" and str($FIELD) in ["display_name", "configuration"]) or
              (str($CLASS) == "EventListQuery" and str($FIELD) == "event_type") or
              (str($CLASS) == "CurrentUserResponse" and str($FIELD) in ["email", "picture"])
            )

  - id: python.pydantic.none-type-field.oauth-storage
    languages: [python]
    severity: WARNING
    message: >-
      Design warning: Pydantic field '$FIELD' allows None. Prefer validating missing or optional user input
      at the API/request boundary and converting it into a required internal DTO before core logic sees it.
      If None means the model is in another state, split the model into explicit DTOs or domain types. Many
      None-able fields in one Pydantic model usually indicate the model has too many responsibilities.
    paths:
      include:
        - '**/api/src/umbod/core/connectors/downstream_mcp/adapters/fastmcp/oauth_storage.py'
    patterns:
      - patterns: *pydantic_none_field_patterns
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: "$FIELD: $ANNOTATION"
                  - pattern: "$FIELD: $ANNOTATION = $VALUE"
              - pattern-not-inside: |
                  class AuthorizationDocument(pydantic.BaseModel):
                    ...
              - pattern-not-inside: |
                  class AuthorizationDocument(umbod.proxies.Model):
                    ...
          - patterns:
              - pattern-either:
                  - pattern: "$FIELD: $ANNOTATION"
                  - pattern: "$FIELD: $ANNOTATION = $VALUE"
              - pattern-either:
                  - pattern-inside: |
                      class AuthorizationDocument(pydantic.BaseModel):
                        ...
                  - pattern-inside: |
                      class AuthorizationDocument(umbod.proxies.Model):
                        ...
              - metavariable-regex:
                  metavariable: $FIELD
                  regex: '^(?!(client_info|tokens|expires_at|metadata|authorization_server)$).*'

  - id: python.pydantic.none-type-field.oauth-api
    languages: [python]
    severity: WARNING
    message: >-
      Design warning: Pydantic field '$FIELD' allows None. Prefer validating missing or optional user input
      at the API/request boundary and converting it into a required internal DTO before core logic sees it.
      If None means the model is in another state, split the model into explicit DTOs or domain types. Many
      None-able fields in one Pydantic model usually indicate the model has too many responsibilities.
    paths:
      include:
        - '**/api/src/umbod/rest/connectors/downstream_mcp/oauth.py'
    patterns:
      - patterns: *pydantic_none_field_patterns
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: "$FIELD: $ANNOTATION"
                  - pattern: "$FIELD: $ANNOTATION = $VALUE"
              - pattern-not-inside: |
                  class BeginRequest(pydantic.BaseModel):
                    ...
              - pattern-not-inside: |
                  class BeginRequest(umbod.proxies.Model):
                    ...
              - pattern-not-inside: |
                  class OAuthDetails(pydantic.BaseModel):
                    ...
              - pattern-not-inside: |
                  class OAuthDetails(umbod.proxies.Model):
                    ...
          - patterns:
              - pattern-either:
                  - pattern: "$FIELD: $ANNOTATION"
                  - pattern: "$FIELD: $ANNOTATION = $VALUE"
              - pattern-either:
                  - pattern-inside: |
                      class BeginRequest(pydantic.BaseModel):
                        ...
                  - pattern-inside: |
                      class BeginRequest(umbod.proxies.Model):
                        ...
              - metavariable-regex:
                  metavariable: $FIELD
                  regex: '^(?!(scopes)$).*'
          - patterns:
              - pattern-either:
                  - pattern: "$FIELD: $ANNOTATION"
                  - pattern: "$FIELD: $ANNOTATION = $VALUE"
              - pattern-either:
                  - pattern-inside: |
                      class OAuthDetails(pydantic.BaseModel):
                        ...
                  - pattern-inside: |
                      class OAuthDetails(umbod.proxies.Model):
                        ...
              - metavariable-regex:
                  metavariable: $FIELD
                  regex: '^(?!(error|granted_scopes|canonical_endpoint|endpoint_differs|issuer)$).*'

  - id: python.function-argument-none-type
    metadata:
      protocol_contract_exceptions:
        - contract: __aexit__(self, exc_type, exc, traceback)
          reason: Python context managers receive three None values on normal exit and must forward exceptions and suppression unchanged.
      compatibility_boundary_exceptions:
        - function: umbod.hosting.applications.create_rest_app
          reason: Public hosting hooks preserve plugin discovery, configured verification, and absent host OAuth override semantics.
        - function: umbod.hosting.applications.create_mcp_app
          reason: Public hosting hooks use None to retain configured authentication, permission projection, and telemetry sink.
        - function: umbod.mcp.public_app.build_mcp
          reason: Legacy composition entrypoint normalizes absent authentication into an explicit unauthenticated transport before internal construction.
      framework_contract_exceptions:
        - contract: httpcore.AsyncNetworkBackend
          methods: [connect_tcp, connect_unix_socket]
          reason: Overrides must preserve HTTP transport timeout, local binding, and socket option absence semantics.
        - contract: httpcore2.AsyncNetworkBackend
          methods: [connect_tcp, connect_unix_socket]
          reason: Overrides must preserve HTTP transport timeout, local binding, and socket option absence semantics.
        - contract: httpcore2.AsyncNetworkStream
          methods: [read, write, start_tls]
          reason: Overrides must preserve transport timeout and TLS server hostname absence semantics.
    languages:
      - python
    severity: WARNING
    message: >-
      Design warning: function or method argument '$PARAM' allows None. Treat uncertainty about missing
      values as a boundary validation concern rather than a downstream core-logic concern. Validate and
      normalize inputs at API, CLI, config, file, or adapter edges, then pass required values internally. If
      None represents a separate state, model that state explicitly with separate DTOs or domain types rather
      than adding None checks throughout the core.
    paths:
