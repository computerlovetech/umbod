[project]
name = "umbod"
version = "0.1.0"
description = "Public connector authoring and discovery SDK for Umbod"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jsonschema>=4.26.0",
    "pydantic>=2.13.4",
    "typer>=0.25.1",
]

[project.scripts]
umbod = "umbod_sdk.cli:app"

[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umbod_sdk"]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
