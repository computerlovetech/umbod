[project]
name = "umbod"
version = "0.1.0"
description = "Public connector authoring and discovery SDK for Umbod"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jsonschema>=4.26.0",
    "packaging>=26.3",
    "pydantic>=2.14.3",
    "typer>=0.29.1",
]

[project.scripts]
umbod = "umbod_sdk.cli:app"

[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umbod_sdk"]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.17.5",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
relative_files = true
