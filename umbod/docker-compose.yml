services:
  api:
    image: umbod
    build:
      context: ..
      dockerfile: umbod/api/Dockerfile
    restart: unless-stopped
    ports:
      - "18010:8000"
    expose:
      - "8001"
    labels:
      - traefik.enable=true
      - "traefik.http.routers.umbod-browser-api.rule=Host(`umbod-admin.computerlove.tech`) && PathPrefix(`/api/`)"
      - traefik.http.routers.umbod-browser-api.entryPoints=http
      - traefik.http.routers.umbod-browser-api.priority=50
      - traefik.http.routers.umbod-browser-api.middlewares=umbod-browser-response@docker,umbod-auth@docker
      - traefik.http.routers.umbod-browser-api.service=umbod-browser-api
      - traefik.http.services.umbod-browser-api.loadbalancer.server.port=8000
    environment:
      - UMBOD_PROFILE=${UMBOD_PROFILE:-local}
      - UMBOD_AUTH=${UMBOD_AUTH:-dev}
      - UMBOD_MCP_DOWNSTREAM_OAUTH_ENABLED=${UMBOD_MCP_DOWNSTREAM_OAUTH_ENABLED:-false}
      - UMBOD_FEATURE_MCP_ADMINISTRATOR_ENABLED=${UMBOD_FEATURE_MCP_ADMINISTRATOR_ENABLED:-true}
      - UMBOD_LOG_LEVEL=${UMBOD_LOG_LEVEL:-info}
      - UMBOD_REST_METRICS_PORT=8001
      - UMBOD_MCP_MESSAGING_TRANSPORT=${UMBOD_MCP_MESSAGING_TRANSPORT:-sql}
      - UMBOD_PUBLIC_SITE_ORIGIN=${UMBOD_PUBLIC_SITE_ORIGIN:-http://localhost:3010}
      - UMBOD_PUBLIC_API_ORIGIN=${UMBOD_PUBLIC_API_ORIGIN:-http://localhost:18010}
      - UMBOD_PUBLIC_MCP_ORIGIN=${UMBOD_PUBLIC_MCP_ORIGIN:-http://localhost:8011}
      - UMBOD_INTERNAL_API_ORIGIN=${UMBOD_INTERNAL_API_ORIGIN:-http://api:8000}
      - UMBOD_DATA_DIR=${UMBOD_DATA_DIR:-/app/data}
      - UMBOD_CONNECTOR_STORE=${UMBOD_CONNECTOR_STORE:-sqlite}
      - UMBOD_ADMIN_GROUP=${UMBOD_ADMIN_GROUP:-umbod:admin}
      - UMBOD_ADMIN_JWT_HEADER=${UMBOD_ADMIN_JWT_HEADER:-X-Auth-Request-Access-Token}
      - UMBOD_USER_PROFILE_MODE=${UMBOD_USER_PROFILE_MODE:-access_claims}
      - UMBOD_USER_PROFILE_JWT_HEADER=${UMBOD_USER_PROFILE_JWT_HEADER:-X-Auth-Request-ID-Token}
      - UMBOD_USER_PROFILE_NAME_CLAIM=${UMBOD_USER_PROFILE_NAME_CLAIM:-name}
      - UMBOD_USER_PROFILE_EMAIL_CLAIM=${UMBOD_USER_PROFILE_EMAIL_CLAIM:-email}
      - UMBOD_USER_PROFILE_PICTURE_CLAIM=${UMBOD_USER_PROFILE_PICTURE_CLAIM:-picture}
      - UMBOD_OIDC_ISSUER_URL=${UMBOD_OIDC_ISSUER_URL:-}
      - UMBOD_ROOT_SECRET=${UMBOD_ROOT_SECRET:-}
      - UMBOD_OIDC_DOMAIN=${UMBOD_OIDC_DOMAIN:-}
      - UMBOD_OIDC_CLIENT_ID=${UMBOD_OIDC_CLIENT_ID:-}
      - UMBOD_OIDC_CLIENT_SECRET=${UMBOD_OIDC_CLIENT_SECRET:-}
      - UMBOD_OIDC_AUDIENCE=${UMBOD_OIDC_AUDIENCE:-}
      - UMBOD_OIDC_TENANT_ID=${UMBOD_OIDC_TENANT_ID:-}
      - UMBOD_OIDC_REQUIRED_SCOPES=${UMBOD_OIDC_REQUIRED_SCOPES:-}
      - UMBOD_CONNECTOR_DEPLOYMENT_CONFIGURATION_PATH=${UMBOD_CONNECTOR_DEPLOYMENT_CONFIGURATION_PATH:-/app/config/connector-deployment-availability.json}
    volumes:
      - umbod-data:/app/data
    configs:
      - source: connector-deployment-availability
        target: ${UMBOD_CONNECTOR_DEPLOYMENT_CONFIGURATION_PATH:-/app/config/connector-deployment-availability.json}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/system/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  mcp:
    image: umbod
    command: ["umbod", "mcp", "serve"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8011:8011"
    expose:
      - "8012"
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.umbod-forward-proto.headers.customrequestheaders.X-Forwarded-Proto=https
      - "traefik.http.routers.umbod-mcp.rule=Host(`umbod.computerlove.tech`)"
      - traefik.http.routers.umbod-mcp.entryPoints=http
      - traefik.http.routers.umbod-mcp.middlewares=umbod-forward-proto@docker
      - traefik.http.services.umbod-mcp.loadbalancer.server.port=8011
    environment:
      - UMBOD_PROFILE=${UMBOD_PROFILE:-local}
      - UMBOD_AUTH=${UMBOD_AUTH:-dev}
      - UMBOD_MCP_DOWNSTREAM_OAUTH_ENABLED=${UMBOD_MCP_DOWNSTREAM_OAUTH_ENABLED:-false}
      - UMBOD_FEATURE_MCP_ADMINISTRATOR_ENABLED=${UMBOD_FEATURE_MCP_ADMINISTRATOR_ENABLED:-true}
      - UMBOD_LOG_LEVEL=${UMBOD_LOG_LEVEL:-info}
      - UMBOD_PUBLIC_SITE_ORIGIN=${UMBOD_PUBLIC_SITE_ORIGIN:-http://localhost:3010}
      - UMBOD_PUBLIC_API_ORIGIN=${UMBOD_PUBLIC_API_ORIGIN:-http://localhost:18010}
      - UMBOD_PUBLIC_MCP_ORIGIN=${UMBOD_PUBLIC_MCP_ORIGIN:-http://localhost:8011}
      - UMBOD_INTERNAL_API_ORIGIN=${UMBOD_INTERNAL_API_ORIGIN:-http://api:8000}
      - UMBOD_DATA_DIR=${UMBOD_DATA_DIR:-/app/data}
      - UMBOD_CONNECTOR_STORE=${UMBOD_CONNECTOR_STORE:-sqlite}
      - UMBOD_ADMIN_GROUP=${UMBOD_ADMIN_GROUP:-umbod:admin}
      - UMBOD_MCP_TOOL_EXPOSURE=${UMBOD_MCP_TOOL_EXPOSURE:-flat}
      - UMBOD_MCP_MESSAGING_TRANSPORT=${UMBOD_MCP_MESSAGING_TRANSPORT:-sql}
      - UMBOD_MCP_METRICS_PORT=8012
      - UMBOD_MCP_STATELESS_HTTP=${UMBOD_MCP_STATELESS_HTTP:-true}
      - UMBOD_MCP_AUTH_DEBUG_ENABLED=${UMBOD_MCP_AUTH_DEBUG_ENABLED:-false}
      - UMBOD_OIDC_ISSUER_URL=${UMBOD_OIDC_ISSUER_URL:-}
      - UMBOD_ROOT_SECRET=${UMBOD_ROOT_SECRET:-}
      - UMBOD_OIDC_DOMAIN=${UMBOD_OIDC_DOMAIN:-}
      - UMBOD_OIDC_CLIENT_ID=${UMBOD_OIDC_CLIENT_ID:-}
      - UMBOD_OIDC_CLIENT_SECRET=${UMBOD_OIDC_CLIENT_SECRET:-}
      - UMBOD_OIDC_AUDIENCE=${UMBOD_OIDC_AUDIENCE:-}
      - UMBOD_OIDC_TENANT_ID=${UMBOD_OIDC_TENANT_ID:-}
      - UMBOD_OIDC_REQUIRED_SCOPES=${UMBOD_OIDC_REQUIRED_SCOPES:-}
      - UMBOD_CONNECTOR_DEPLOYMENT_CONFIGURATION_PATH=${UMBOD_CONNECTOR_DEPLOYMENT_CONFIGURATION_PATH:-/app/config/connector-deployment-availability.json}
    volumes:
      - umbod-data:/app/data
    configs:
      - source: connector-deployment-availability
        target: ${UMBOD_CONNECTOR_DEPLOYMENT_CONFIGURATION_PATH:-/app/config/connector-deployment-availability.json}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8011/system/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    profiles:
      - auth
    restart: unless-stopped
    command:
      - --alpha-config=/etc/oauth2-proxy/alpha.yml
      - --whitelist-domain=${UMBOD_OIDC_DOMAIN:-example.eu.auth0.com}
      - --whitelist-domain=${UMBOD_PUBLIC_SITE_HOST:-umbod-admin.computerlove.tech}
      - --redirect-url=${UMBOD_PUBLIC_SITE_ORIGIN:-https://umbod-admin.computerlove.tech}/oauth2/callback
      - --cookie-secret=${UMBOD_OAUTH2_PROXY_COOKIE_SECRET:-}
      - --email-domain=${UMBOD_OAUTH2_PROXY_EMAIL_DOMAIN:-*}
      - --cookie-refresh=${UMBOD_OAUTH2_PROXY_COOKIE_REFRESH:-5m}
      - --cookie-expire=${UMBOD_OAUTH2_PROXY_COOKIE_EXPIRE:-8h}
      - --reverse-proxy=true
      - --skip-provider-button=true
    environment:
      UMBOD_OIDC_CLIENT_SECRET: ${UMBOD_OIDC_CLIENT_SECRET:-}
    configs:
      - source: oauth2-proxy-alpha
        target: /etc/oauth2-proxy/alpha.yml
    ports:
      - "4180:4180"
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.umbod-auth.forwardauth.address=http://oauth2-proxy:4180/oauth2/auth
      - traefik.http.middlewares.umbod-auth.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.umbod-auth.forwardauth.authResponseHeaders=Authorization,X-Auth-Request-Access-Token,X-Auth-Request-ID-Token,X-Auth-Request-User,X-Auth-Request-Email
      - "traefik.http.routers.umbod-oauth.rule=Host(`umbod-admin.computerlove.tech`) && PathPrefix(`/oauth2/`)"
      - traefik.http.routers.umbod-oauth.entryPoints=http
      - traefik.http.routers.umbod-oauth.priority=100
      - traefik.http.routers.umbod-oauth.middlewares=umbod-browser-response@docker
      - traefik.http.routers.umbod-oauth.service=umbod-oauth
      - traefik.http.services.umbod-oauth.loadbalancer.server.port=4180

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3010:3000"
    labels:
      - traefik.enable=true
      - "traefik.http.routers.umbod-frontend.rule=Host(`umbod-admin.computerlove.tech`) && !Path(`/system/health`)"
      - traefik.http.routers.umbod-frontend.entryPoints=http
      - traefik.http.routers.umbod-frontend.priority=10
      - traefik.http.routers.umbod-frontend.service=umbod-oauth
      - traefik.http.routers.umbod-frontend.middlewares=umbod-browser-response@docker
      - "traefik.http.routers.umbod-frontend-secure.rule=Host(`umbod-admin.computerlove.tech`) && !Path(`/system/health`)"
      - traefik.http.routers.umbod-frontend-secure.entryPoints=https
      - traefik.http.routers.umbod-frontend-secure.priority=10
      - traefik.http.routers.umbod-frontend-secure.service=umbod-oauth
      - traefik.http.routers.umbod-frontend-secure.middlewares=umbod-browser-response@docker
      - traefik.http.routers.umbod-frontend-secure.tls=true
      - traefik.http.middlewares.umbod-browser-response.headers.customresponseheaders.Authorization=
      - traefik.http.middlewares.umbod-browser-response.headers.customresponseheaders.X-Auth-Request-Access-Token=
      - traefik.http.middlewares.umbod-browser-response.headers.customresponseheaders.X-Auth-Request-ID-Token=
      - traefik.http.middlewares.umbod-browser-response.headers.customresponseheaders.X-Auth-Request-User=
      - traefik.http.middlewares.umbod-browser-response.headers.customresponseheaders.X-Auth-Request-Email=
      - traefik.http.middlewares.umbod-browser-response.headers.customresponseheaders.X-Auth-Request-Preferred-Username=
      - traefik.http.middlewares.umbod-browser-response.headers.customresponseheaders.X-Auth-Request-Groups=
      - traefik.http.middlewares.umbod-browser-response.headers.customresponseheaders.X-Forwarded-Access-Token=
      - traefik.http.services.umbod-frontend.loadbalancer.server.port=3000
      - "traefik.http.routers.umbod-favicon.rule=Host(`umbod-admin.computerlove.tech`) && (Path(`/favicon.svg`) || Path(`/favicon.ico`) || Path(`/umbod-favicon-v2.ico`) || Path(`/umbod-favicon-v2.png`) || Path(`/umbod-apple-touch-icon-v2.png`))"
      - traefik.http.routers.umbod-favicon.entryPoints=http
      - traefik.http.routers.umbod-favicon.priority=20
      - traefik.http.routers.umbod-favicon.service=umbod-frontend
      - "traefik.http.routers.umbod-signed-out.rule=Host(`umbod-admin.computerlove.tech`) && Path(`/signed-out.html`)"
      - traefik.http.routers.umbod-signed-out.entryPoints=http
      - traefik.http.routers.umbod-signed-out.priority=20
      - traefik.http.routers.umbod-signed-out.service=umbod-frontend
      - "traefik.http.routers.umbod-signed-out-secure.rule=Host(`umbod-admin.computerlove.tech`) && Path(`/signed-out.html`)"
      - traefik.http.routers.umbod-signed-out-secure.entryPoints=https
      - traefik.http.routers.umbod-signed-out-secure.priority=20
      - traefik.http.routers.umbod-signed-out-secure.service=umbod-frontend
      - traefik.http.routers.umbod-signed-out-secure.tls=true
    environment:
      - PUBLIC_AUTH0_DOMAIN=${PUBLIC_AUTH0_DOMAIN:-}
      - PUBLIC_AUTH0_CLIENT_ID=${PUBLIC_AUTH0_CLIENT_ID:-}
      - PUBLIC_LOGOUT_RETURN_URL=${PUBLIC_LOGOUT_RETURN_URL:-}
      - PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL:-/api}
      - PUBLIC_MCP_BASE_URL=${UMBOD_PUBLIC_MCP_ORIGIN:-http://localhost:8011}
      - API_PROXY_ORIGIN=http://api:8000
    depends_on:
      - api
      - mcp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/system/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  umbod-data:

configs:
  oauth2-proxy-alpha:
    content: |
      server:
        BindAddress: 0.0.0.0:4180
      upstreamConfig:
        upstreams:
          - id: frontend
            path: /
            uri: http://frontend:3000/
      injectRequestHeaders:
        - name: X-Forwarded-Groups
          values: [{claim: groups}]
        - name: X-Forwarded-User
          values: [{claim: user}]
        - name: X-Forwarded-Email
          values: [{claim: email}]
        - name: X-Forwarded-Preferred-Username
          values: [{claim: preferred_username}]
        - name: X-Forwarded-Access-Token
          values: [{claim: access_token}]
        - name: X-Auth-Request-ID-Token
          values: [{claim: id_token}]
        - name: Authorization
          values: [{claim: access_token, prefix: 'Bearer '}]
      injectResponseHeaders:
        - name: X-Auth-Request-User
          values: [{claim: user}]
        - name: X-Auth-Request-Email
          values: [{claim: email}]
        - name: X-Auth-Request-Preferred-Username
          values: [{claim: preferred_username}]
        - name: X-Auth-Request-Groups
          values: [{claim: groups}]
        - name: X-Auth-Request-Access-Token
          values: [{claim: access_token}]
        - name: X-Auth-Request-ID-Token
          values: [{claim: id_token}]
        - name: Authorization
          values: [{claim: access_token, prefix: 'Bearer '}]
      providers:
        - id: auth0
          provider: oidc
          clientID: "${UMBOD_OIDC_CLIENT_ID:-}"
          clientSecret: |-
            $${UMBOD_OIDC_CLIENT_SECRET}
          scope: ${UMBOD_OAUTH2_PROXY_SCOPE:-openid email profile permissions offline_access}
          skipClaimsFromProfileURL: false
          oidcConfig:
            audienceClaims: [aud]
            emailClaim: email
            issuerURL: https://${UMBOD_OIDC_DOMAIN:-example.eu.auth0.com}/
            groupsClaim: groups
            insecureSkipNonce: true
          loginURLParameters:
            - name: approval_prompt
              default: [force]
            - name: audience
              default: ["${UMBOD_OIDC_AUDIENCE:-https://umbod.computerlove.tech}"]
  connector-deployment-availability:
    content: |
      {
        "connectors": []
      }
