[project]
name = "umbod-core"
version = "0.0.1-beta.2"
description = "Umbod API, MCP server, and CLI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "umbod",
    "aiosqlite>=0.22.1",
    "fastapi>=0.136.1",
    "fastmcp-slim[client]==4.0.0b1",
    "fastmcp[apps,code-mode]==4.0.0b1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "packaging>=24.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "pyjwt[crypto]>=2.10.1",
    "python-multipart>=0.0.29",
    "starlette>=1.0.1",
    "typer>=0.25.1",
    "uvicorn[standard]>=0.46.0",
]

[project.scripts]
umbod = "umbod.cli.main:run"

[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umbod", "src/messaging"]

[tool.hatch.build.targets.wheel.force-include]
"src/umbod/mcp/assets/logo.png" = "umbod/mcp/assets/logo.png"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.uv]
default-groups = ["dev", "shared", "api", "mcp"]
constraint-dependencies = ["fastmcp-slim==4.0.0b1"]

[tool.uv.sources]
umbod = { path = "../../packages/umbod-sdk", editable = true }

[dependency-groups]
shared = [
    "PyJWT[crypto]>=2.10.1",
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "typer>=0.25.1",
    "uvicorn[standard]>=0.46.0",
]
api = [
    "fastapi>=0.136.1",
    "fastmcp-slim[client]==4.0.0b1",
    "prometheus-client>=0.26.0",
    "python-multipart>=0.0.29",
]
mcp = [
    "fastmcp[apps,code-mode]==4.0.0b1",
    "prometheus-client>=0.26.0",
    "starlette>=1.0.1",
]
dev = [
    "httpx2>=2.4.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
