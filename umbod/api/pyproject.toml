[project]
name = "umbod-core"
version = "0.0.1-beta.2"
description = "Umbod API, MCP server, and CLI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "umbod",
    "aiosqlite>=0.22.1",
    "fastapi>=0.163.1",
    "fastmcp-slim[client]==4.2.0",
    "fastmcp[apps,code-mode]==4.2.0",
    "httpcore==1.0.9",
    "httpcore2==2.16.2",
    "httpx>=0.28.1",
    "httpx2==2.16.2",
    "jsonschema>=4.26.0",
    "referencing==0.37.0",
    "packaging>=26.3",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.34",
    "starlette>=1.10.0",
    "typer>=0.29.1",
    "uvicorn[standard]>=0.54.0",
    "opentelemetry-proto>=1.45.2,<2",
    "protobuf>=7.36.2,<8",
    "googleapis-common-protos>=1.76.0,<2",
    "aiobotocore>=3.10.0,<4",
]

[project.scripts]
umbod = "umbod.cli.main:run"

[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umbod", "src/messaging"]

[tool.hatch.build.targets.wheel.force-include]
"src/umbod/mcp/assets/logo.png" = "umbod/mcp/assets/logo.png"
"src/umbod/rest/install/assets/install.sh" = "umbod/rest/install/assets/install.sh"
"src/umbod/rest/install/assets/install.ps1" = "umbod/rest/install/assets/install.ps1"
"../../skills/integrations/umbod-connected-apps/SKILL.md" = "umbod/harness_plugin_resources/SKILL.md"
"../../skills/integrations/umbod-agent-behaviour/SKILL.md" = "umbod/harness_plugin_resources/AGENT_BEHAVIOUR_SKILL.md"
"../../skills/integrations/run-diagnostics/SKILL.md" = "umbod/harness_plugin_resources/RUN_DIAGNOSTICS_SKILL.md"
"../../LICENSE" = "umbod/harness_plugin_resources/LICENSE"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.uv]
default-groups = ["dev", "shared", "api", "mcp"]
constraint-dependencies = ["fastmcp-slim==4.2.0"]

[tool.uv.sources]
umbod = { path = "../../packages/umbod-sdk", editable = true }

[dependency-groups]
shared = [
    "pyjwt[crypto]>=2.15.1",
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "typer>=0.29.1",
    "uvicorn[standard]>=0.54.0",
]
telemetry-serialization = [
    "opentelemetry-proto>=1.45.2,<2",
    "protobuf>=7.36.2,<8",
    "googleapis-common-protos>=1.76.0,<2",
]
api = [
    { include-group = "telemetry-serialization" },
    "fastapi>=0.163.1",
    "fastmcp-slim[client]==4.2.0",
    "prometheus-client>=0.26.0",
    "python-multipart>=0.0.34",
]
mcp = [
    "fastmcp[apps,code-mode]==4.2.0",
    "prometheus-client>=0.26.0",
    "starlette>=1.10.0",
]
dev = [
    "httpx2>=2.16.2",
    "markdown-it-py>=4.3.0,<5",
    "mutmut==3.8.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7,<8",
    "pytest-xdist>=3.8,<4",
    "pyyaml>=6.0.3,<7",
    "ruff>=0.17.5",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src"]
relative_files = true
