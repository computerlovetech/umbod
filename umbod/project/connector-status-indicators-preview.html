<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connector status · Umbod design previews</title>
<style>
  :root{color-scheme:light;--ink:#162520;--muted:#51655c;--line:#d8e2dc;--surface:#fff;--subtle:#f4f7f5;--accent:#066650;--good:#226646;--good-bg:#eaf6ee;--warn:#805008;--warn-bg:#fff3db;--bad:#a02f2d;--bad-bg:#fff0ed;--neutral:#435950;--neutral-bg:#eaf0ec;font:16px/1.45 system-ui,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:#f2f6f3;color:var(--ink)}
  main{width:min(100% - 2rem,66rem);margin:clamp(1.5rem,5vw,4.5rem) auto}
  .intro{display:grid;gap:.65rem;margin-bottom:1.4rem}
  .eyebrow,.number{color:var(--accent);font:700 .72rem/1.2 ui-monospace,monospace;letter-spacing:.095em;text-transform:uppercase}
  h1,h2,h3,p,dl,dd{margin:0}
  h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.05;letter-spacing:-.055em}
  .intro p,.concept p,.description{color:var(--muted)}
  .picker{display:flex;align-items:center;gap:.6rem 1rem;flex-wrap:wrap;margin-bottom:1.6rem;padding:.85rem 1rem;border:1px solid var(--line);border-radius:.85rem;background:var(--surface)}
  label{font-size:.85rem;font-weight:700}
  select{max-width:100%;min-width:min(15rem,100%);padding:.55rem .65rem;border:1px solid #a4b8ac;border-radius:.45rem;background:var(--surface);color:inherit;font:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  #previews{display:grid;gap:1.2rem}
  .concept{background:var(--surface);border:1px solid var(--line);border-radius:1rem;overflow:hidden;container-type:inline-size}
  .concept-heading{display:flex;align-items:baseline;flex-wrap:wrap;gap:.35rem .75rem;background:var(--subtle);border-bottom:1px solid var(--line);padding:.8rem clamp(.85rem,3vw,1.6rem)}
  h2{font-size:1rem}
  .concept-heading p{font-size:.82rem}
  .connector{padding:clamp(.9rem,3vw,1.6rem)}
  .connector-head{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
  .connector-mark{display:grid;place-items:center;flex:none;width:2.45rem;height:2.45rem;border-radius:.75rem;background:#163c32;color:white}
  .connector-mark .icon{width:1.35rem;height:1.35rem}
  h3{font-size:1.22rem;letter-spacing:-.025em;overflow-wrap:anywhere}
  .publication{display:inline-flex;align-items:center;gap:.32rem;margin-inline-start:auto;border:1px solid var(--line);background:var(--subtle);padding:.28rem .5rem;border-radius:999px;font-size:.72rem;font-weight:700;color:var(--muted)}
  .publication .icon{width:.85rem;height:.85rem}
  .description{font-size:.9rem;margin:.6rem 0 1.05rem}
  .icon{width:1.15rem;height:1.15rem;flex:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .good{--tone:var(--good);--tint:var(--good-bg)}
  .warning{--tone:var(--warn);--tint:var(--warn-bg)}
  .danger{--tone:var(--bad);--tint:var(--bad-bg)}
  .neutral{--tone:var(--neutral);--tint:var(--neutral-bg)}
  .badge-icon{display:grid;place-items:center;flex:none;width:2.1rem;height:2.1rem;border-radius:.62rem;background:var(--tint);color:var(--tone)}
  dt{color:var(--muted);font-weight:650;font-size:.74rem}
  dd{font-size:.9rem;font-weight:720;overflow-wrap:anywhere}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,10rem),1fr));gap:.55rem}
  .tile{display:grid;align-content:start;justify-items:start;gap:.15rem;background:var(--subtle);border:1px solid var(--line);border-radius:.7rem;padding:.7rem .8rem}
  .tile .badge-icon{margin-bottom:.25rem}
  .spotlight{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.55fr);align-items:stretch;gap:.65rem}
  .spotlight:has(> :only-child){grid-template-columns:1fr}
  .signal{border-radius:.7rem;border-inline-start:3px solid var(--tone);background:var(--tint);padding:.75rem .85rem}
  .signal > div{position:relative;padding-inline-start:3rem}
  .signal .badge-icon{position:absolute;inset-inline-start:0;top:50%;translate:0 -50%;background:var(--surface);width:2.35rem;height:2.35rem;border-radius:50%}
  .signal dd{color:var(--tone);font-size:1rem}
  .context{display:flex;align-items:center;flex-wrap:wrap;gap:.65rem 1.2rem;border:1px solid var(--line);border-radius:.7rem;padding:.7rem .85rem}
  .context-item{position:relative;padding-inline-start:1.38rem}
  .context-item .icon{position:absolute;inset-inline-start:0;top:50%;translate:0 -50%;color:var(--tone);width:1rem;height:1rem}
  .chips{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem;border-block:1px solid var(--line);padding:.65rem 0}
  .chip{display:flex;align-items:center;flex-wrap:wrap;max-width:100%;gap:.15rem .38rem;padding:.36rem .6rem;border-radius:.5rem;background:var(--tint);color:var(--tone)}
  .chip dt{display:flex;align-items:center;gap:.32rem;color:inherit}
  .chip dt .icon{margin-inline-end:.05rem}
  .chip dt::after{content:":"}
  .chip dd{font-size:.8rem}
  .chip .icon{width:.95rem;height:.95rem}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  @container (max-width:35rem){.spotlight{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <header class="intro">
    <span class="eyebrow">Umbod / Connector design study</span>
    <h1>Connector status indicators</h1>
    <p>Compare three ways to read the same connector at a glance.</p>
  </header>
  <div class="picker">
    <label for="scenario">Preview connector</label>
    <select id="scenario">
      <option value="healthy">Shared MCP · Healthy</option>
      <option value="failed">Shared MCP · Discovery failed</option>
      <option value="unknown">Shared MCP · Missing token</option>
      <option value="personal">Personal MCP · Published</option>
      <option value="openapi">OpenAPI · Published</option>
      <option value="plugin">SDK plugin · Unpublished</option>
    </select>
    <span id="announcement" class="sr-only" role="status"></span>
  </div>
  <div id="previews"></div>
</main>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-connector" viewBox="0 0 24 24"><path d="M10 7V3m4 4V3M7 7h10v4a5 5 0 0 1-5 5v5m-5-10V7"/></symbol>
  <symbol id="i-shared" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2m1-15a3 3 0 0 1 0 6m4 9v-2a4 4 0 0 0-2-3.5"/></symbol>
  <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.6 2.6L16 9"/></symbol>
  <symbol id="i-fail" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/></symbol>
  <symbol id="i-unknown" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 9a2 2 0 0 1 4 .5c0 1-2 1.5-2 3m0 2.5v.2"/></symbol>
  <symbol id="i-open" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2m-3.5 9v2"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4m-4 4v2"/></symbol>
  <symbol id="i-warning" viewBox="0 0 24 24"><path d="M10.3 4.5 2.6 18a1.6 1.6 0 0 0 1.4 2.4h16a1.6 1.6 0 0 0 1.4-2.4L13.7 4.5a2 2 0 0 0-3.4 0ZM12 9v4m0 3v.3"/></symbol>
  <symbol id="i-tools" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V4h8v3M3 12h18m-12 0v2m6-2v2"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4m8-4v4M3 10h18m-13 5h2m4 0h2"/></symbol>
  <symbol id="i-package" viewBox="0 0 24 24"><path d="m12 3 9 5v8l-9 5-9-5V8l9-5Zm0 9 9-4m-9 4L3 8m9 4v9M7.5 5.5l9 4.5"/></symbol>
  <symbol id="i-published" viewBox="0 0 24 24"><path d="M3 12s3-6 9-6 9 6 9 6-3 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="2"/></symbol>
  <symbol id="i-unpublished" viewBox="0 0 24 24"><path d="M4 4l16 16M9 6.5c1-.35 2-.5 3-.5 6 0 9 6 9 6a15 15 0 0 1-2 2.7m-3.3 2.65c-1.1.4-2.35.65-3.7.65-6 0-9-6-9-6a15 15 0 0 1 3-3.6"/></symbol>
</svg>
<script>
  const icon = (name) => `<svg class="icon" aria-hidden="true" focusable="false"><use href="#i-${name}"/></svg>`;
  const indicator = (label, value, glyph, tone) => ({ label, value, glyph, tone });
  const shared = indicator('Authorization mode', 'Shared', 'shared', 'neutral');
  const health = (value, glyph, tone) => indicator('Discovery health', value, glyph, tone);
  const auth = (value, glyph, tone) => indicator('Authentication', value, glyph, tone);
  const tools = (count, label) => indicator(label, `${count} tools`, 'tools', 'neutral');
  const svelte = { name: 'Svelte MCP', description: 'Svelte documentation and autofixing tools for development.', type: 'connector' };
  const scenarios = {
    healthy: { ...svelte, published: false, indicators: [shared, health('Healthy', 'check', 'good'), auth('Not required', 'open', 'neutral'), tools(4, 'Discovered tools')], emphasis: 1 },
    failed: { ...svelte, published: true, indicators: [shared, health('Discovery failed', 'fail', 'danger'), auth('Bearer token configured', 'lock', 'neutral'), tools(4, 'Discovered tools')], emphasis: 1 },
    unknown: { ...svelte, published: false, indicators: [shared, health('Not checked', 'unknown', 'neutral'), auth('Bearer token missing', 'warning', 'warning'), tools(0, 'Discovered tools')], emphasis: 2 },
    personal: { name: 'Calendar MCP', description: 'Find and manage events using your own calendar account.', type: 'connector', published: true, indicators: [indicator('Authorization mode', 'Personal', 'person', 'neutral')], emphasis: -1 },
    openapi: { name: 'Orders API', description: 'Look up orders and shipment statuses.', type: 'connector', published: true, indicators: [indicator('Updated', '22 Nov 2026', 'calendar', 'neutral')], emphasis: -1 },
    plugin: { name: 'Document tools', description: 'Extract and format text from documents.', type: 'package', published: false, indicators: [indicator('Source', 'SDK plugin', 'package', 'neutral'), tools(2, 'Tools')], emphasis: -1 }
  };
  const badge = ({ glyph }) => `<span class="badge-icon">${icon(glyph)}</span>`;
  const context = (items) => items.length ? `<dl class="context">${items.map(item => `<div class="context-item ${item.tone}"><dt>${icon(item.glyph)}${item.label}</dt><dd>${item.value}</dd></div>`).join('')}</dl>` : '';
  const concepts = [
    { name: 'Icon tiles', description: 'One tile per indicator, with no single field dominating.', render: ({ indicators }) => `<dl class="tiles">${indicators.map(item => `<div class="tile ${item.tone}"><dt>${badge(item)}${item.label}</dt><dd>${item.value}</dd></div>`).join('')}</dl>` },
    { name: 'Status spotlight', description: 'Lead with discovery or the issue that needs attention.', render: ({ indicators, emphasis }) => {
      const primary = indicators[emphasis];
      return `<div class="spotlight">${primary ? `<dl class="signal ${primary.tone}"><div><dt>${badge(primary)}${primary.label}</dt><dd>${primary.value}</dd></div></dl>` : ''}${context(indicators.filter((_, index) => index !== emphasis))}</div>`;
    } },
    { name: 'Inline badges', description: 'Keep every label and value visible in a compact strip.', render: ({ indicators }) => `<dl class="chips">${indicators.map(item => `<div class="chip ${item.tone}"><dt>${icon(item.glyph)}${item.label}</dt><dd>${item.value}</dd></div>`).join('')}</dl>` }
  ];
  const picker = document.querySelector('#scenario');
  const previews = document.querySelector('#previews');
  const announcement = document.querySelector('#announcement');
  const render = () => {
    const connector = scenarios[picker.value];
    const publication = connector.published ? 'Published' : 'Unpublished';
    previews.innerHTML = concepts.map((concept, index) => `<section class="concept" aria-labelledby="concept-${index}">
      <header class="concept-heading"><span class="number" aria-hidden="true">0${index + 1}</span><h2 id="concept-${index}">${concept.name}</h2><p>${concept.description}</p></header>
      <div class="connector"><div class="connector-head"><span class="connector-mark">${icon(connector.type)}</span><h3>${connector.name}</h3><span class="publication">${icon(publication.toLowerCase())}${publication}</span></div>
      <p class="description">${connector.description}</p>${concept.render(connector)}</div></section>`).join('');
  };
  picker.addEventListener('change', () => {
    render();
    announcement.textContent = `All three previews now show ${picker.selectedOptions[0].textContent}.`;
  });
  render();
</script>
</body>
</html>
