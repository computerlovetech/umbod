core:
  api:
    env:
      UMBOD_FILESYSTEM_UPLOAD_MAX_BYTES: "11534336"
      UMBOD_PERSONAL_CONNECTIONS_IDENTITY_NAMESPACE: "test:kind-personal-catalogue"
  mcp:
    administrator:
      hosting: separate
      port: 8017
      baseUrl: http://127.0.0.1:28017
    env:
      UMBOD_FILESYSTEM_UPLOAD_MAX_BYTES: "11534336"
      UMBOD_PERSONAL_CONNECTIONS_IDENTITY_NAMESPACE: "test:kind-personal-catalogue"
telemetry:
  enabled: true
  publicBaseUrl: https://collector.runtime.invalid/otlp
  bearerTokenSecret:
    name: umbod-collector-ci
    key: token
config:
  features:
    mcp:
      administratorEnabled: true
  telemetryAnalytics:
    enabled: true
  authorization:
    adminMembershipClaim: groups
    mcpPermissionClaim: groups
plugins:
  availableConnectorIds:
    - test
  image:
    repository: umbod-kind-test-connector
    tag: ci
    pullPolicy: Never
