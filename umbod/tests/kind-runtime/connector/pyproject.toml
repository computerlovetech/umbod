[project]
name = "umbod-kind-test-connector"
version = "0.0.1"
requires-python = ">=3.14"
dependencies = ["umbod>=0.1.0,<0.2.0"]

[project.entry-points."umbod.connectors"]
test = "umbod_kind_test_connector:plugin"

[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umbod_kind_test_connector"]
