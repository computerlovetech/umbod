site_name: Umbod
site_url: https://umbod.ai/docs/
site_description: Administrator guides for installing Umbod, connecting tools, managing access, and running a deployment.
site_dir: site

theme:
  name: material
  custom_dir: docs-theme
  logo: assets/umbod-logo.svg
  favicon: assets/umbod-logo.svg
  font: false
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Use light mode

extra_css:
  - assets/umbod.css

extra:
  homepage: https://umbod.ai

nav:
  - Home: index.md
  - Getting started:
      - Overview: getting-started/index.md
      - Kubernetes installation: getting-started/kubernetes-installation.md
  - Access and integrations:
      - Connector setup and access: using-umbod/connectors.md
      - File access and sharing: using-umbod/files.md
      - Codex CLI plugin: using-umbod/codex-plugin.md
  - Operations:
      - Configuration: operations/configuration.md
      - Connect to Umbod: operations/service-topology.md
      - Store files in S3: operations/s3-file-storage.md
      - Telemetry collection: operations/telemetry-ingestion.md
      - Log analytics: using-umbod/log-analytics.md
      - Scheduled cleanup: operations/cleanup.md
      - Troubleshoot failures: operations/application-diagnostics.md
  - Connector plugins:
      - Overview: plugins/index.md
      - Build a connector: plugins/build-a-connector.md
  - Reference:
      - Helm values: reference/helm-values.md
      - Built-in MCP tools: reference/built-in-tools.md
      - Personal access token API: operations/personal-access-tokens.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

plugins:
  - search

hooks:
  - docs/hooks.py

exclude_docs: |
  __pycache__/
  *.pyc

strict: true
