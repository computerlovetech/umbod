site_name: Umbod
site_url: https://umbod.ai/docs/
site_description: Administrator guides for installing Umbod, connecting tools, managing access, and running a deployment.
site_dir: site

theme:
  name: material
  custom_dir: docs-theme
  logo: assets/umbod-logo.svg
  favicon: assets/umbod-logo.svg
  font: false
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Use light mode

extra_css:
  - assets/umbod.css

extra:
  homepage: https://umbod.ai

nav:
  - Home: index.md
  - Use Umbod:
      - Connectors: use/connectors.md
      - Connect an agent: use/connect-agents.md
      - Files: use/files.md
      - Insights: use/insights.md
  - Self-host:
      - Try it locally: self-host/local.md
      - Install for a team: self-host/install.md
      - Operate: self-host/operate.md
      - Store files in S3: self-host/s3.md
      - Collect telemetry: self-host/telemetry.md
      - Troubleshooting: self-host/troubleshooting.md
  - Extend:
      - Build a connector: extend/build-a-connector.md
  - Reference:
      - Helm values: reference/helm-values.md
      - Built-in MCP tools: reference/built-in-tools.md
      - REST API: reference/rest-api.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

plugins:
  - search

hooks:
  - docs/hooks.py

exclude_docs: |
  __pycache__/
  *.pyc
  hooks.py

strict: true
