apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "umbod.fullname" . }}-frontend
  labels:
    {{- include "umbod.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "umbod.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "umbod.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      enableServiceLinks: false
      serviceAccountName: {{ include "umbod.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: {{ .Values.frontend.port | quote }}
            - name: UMBOD_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: ORIGIN
              value: {{ .Values.config.publicOrigins.site | quote }}
            - name: PROTOCOL_HEADER
              value: x-forwarded-proto
            - name: HOST_HEADER
              value: x-forwarded-host
            - name: PUBLIC_MCP_BASE_URL
              value: {{ .Values.config.publicOrigins.mcp | quote }}
            - name: PRIVATE_API_BASE_URL
              value: http://{{ include "umbod.fullname" . }}-api:{{ .Values.services.api.port }}
            - name: BODY_SIZE_LIMIT
              value: {{ .Values.frontend.bodySizeLimit | quote }}
            - name: PRIVATE_AUTH_TOKEN_HEADER
              value: {{ .Values.frontend.privateAuthTokenHeader | quote }}
            {{- range $key, $value := .Values.frontend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /system/health
              port: http
              httpHeaders:
                - name: Host
                  value: frontend
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /system/health
              port: http
              httpHeaders:
                - name: Host
                  value: frontend
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /system/health
              port: http
              httpHeaders:
                - name: Host
                  value: frontend
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
