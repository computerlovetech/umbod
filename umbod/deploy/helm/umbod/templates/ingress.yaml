{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "umbod.fullname" . }}
  labels:
    {{- include "umbod.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          {{- range $path := list "/.well-known/oauth-protected-resource" "/.well-known/oauth-authorization-server" "/authorize" "/token" "/register" "/revoke" }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "umbod.fullname" $ }}-mcp
                port:
                  number: {{ $.Values.services.mcp.port }}
          {{- end }}
          {{- range $component := list "api" "mcp" "frontend" }}
          - path: {{ index $.Values.ingress.paths $component }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "umbod.fullname" $ }}-{{ $component }}
                port:
                  number: {{ (index $.Values.services $component).port }}
          {{- end }}
{{- end }}
