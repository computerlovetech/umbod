apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "umbod.fullname" . }}-test-service-health"
  labels:
    {{- include "umbod.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: service-health
      image: curlimages/curl:8.12.1
      command: ["/bin/sh", "-ec"]
      args:
        - |
          curl --fail --silent --show-error "http://{{ include "umbod.fullname" . }}-api:{{ .Values.services.api.port }}/system/health" | grep -q '"service":"umbod-api"'
          curl --fail --silent --show-error "http://{{ include "umbod.fullname" . }}-mcp:{{ .Values.services.mcp.port }}/system/health" | grep -q '"status":"ok"'
          curl --fail --silent --show-error --header 'Host: frontend' "http://{{ include "umbod.fullname" . }}-frontend:{{ .Values.services.frontend.port }}/system/health" | grep -q '"status":"ok"'
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
