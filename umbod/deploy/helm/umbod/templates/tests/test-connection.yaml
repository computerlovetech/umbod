apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "umbod.fullname" . }}-test-service-health"
  labels:
    {{- include "umbod.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: service-health
      image: curlimages/curl:8.12.1
      command: ["/bin/sh", "-ec"]
      args:
        - |
          curl --fail --silent --show-error "http://{{ include "umbod.fullname" . }}-api:{{ .Values.services.api.port }}/system/health" | grep -q '"service":"umbod-api"'
          curl --fail --silent --show-error "http://{{ include "umbod.fullname" . }}-mcp:{{ .Values.services.mcp.port }}/system/health" | grep -q '"status":"ok"'
          frontend="http://{{ include "umbod.fullname" . }}-frontend:{{ .Values.services.frontend.port }}"
          curl --fail --silent --show-error "${frontend}/system/health" | grep -q '"service":"umbod-frontend"'
          curl --fail --silent --show-error "${frontend}/app-config.json" | grep -q '"apiBaseUrl"'
          curl --fail --silent --show-error --dump-header /tmp/config-headers "${frontend}/app-config.json" > /dev/null
          grep -qi 'cache-control: no-store' /tmp/config-headers
          curl --fail --silent --show-error "${frontend}/admin/connectors" | grep -qi '<html'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "${frontend}/_app/missing.js")" = 404
          curl --fail --silent --show-error "${frontend}/api/system/health" | grep -q '"service":"umbod-api"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "${frontend}/api/not-a-route")" = 404
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
