{{- range $component := list "api" "mcp" "frontend" }}
{{- $service := index $.Values.services $component }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "umbod.fullname" $ }}-{{ $component }}
  labels:
    {{- include "umbod.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  selector:
    {{- include "umbod.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ ternary "frontend" "core" (eq $component "frontend") }}
  ports:
    - name: http
      port: {{ $service.port }}
      targetPort: {{ ternary "http" (printf "http-%s" $component) (eq $component "frontend") }}
      protocol: TCP
{{- end }}
